",arcNew:"Nuovo record!",arcUnlocked:"Sbloccato il livello {n}!",arcAgain:"Rigioca",arcNext:"Prossimo livello",how_serve:`Sei sulla riga di fondo e vedi il campo da dietro.
1. Prima di lanciare trascina a destra o a sinistra per spostarti sulla riga.
2. Tocca lo schermo per lanciare la palla in alto.
3. Quando la palla è nel riquadro giallo TOCCA LA PALLA: è il colpo. Al centro del riquadro è il momento perfetto.
4. Il PUNTO del pallone che tocchi decide dove va: al centro va dritta; sul lato sinistro va a destra e sul lato destro va a sinistra; sotto va più alta e lunga, sopra più bassa (rischi la rete).
5. Senza staccare fai uno SWIPE: più è lungo e veloce, più è forte (guarda la barra a destra). Lo swipe dà anche la rotazione:
⤵ swipe in su: top spin, la palla scende presto. Più forte tiri, più gira.
↰ ↱ swipe in diagonale: effetto, la palla curva da quella parte.
🍂 swipe e poi FERMA il dito prima di staccarlo: flottante (foglia morta), niente rotazione, la palla balla e dopo la rete cade di colpo.
6. Stacca il dito per battere. Se tocchi la palla al centro nel momento giusto va sempre dentro: piano cade corta, forte arriva in fondo.
Dopo il colpo un riquadro ti mostra dove hai toccato la palla e dov'era nel riquadro giallo.
Punti: nella zona gialla vale il massimo, dentro il campo meno, rete o fuori zero.`,how_set:`Sei la palleggiatrice: la palla arriva dalla ricezione.
1. Quando la palla è vicina alle tue mani APPOGGIA il dito: la palla rallenta.
2. Fai uno SWIPE verso dove vuoi mandare la palla e stacca il dito. Puoi anche tenere premuto prima di partire: conta solo lo swipe.
3. La FORZA dipende dallo swipe: più trascini lontano e veloce, più la palla va forte (barra in alto). Swipe corto e lento = palla piano.
4. La DIREZIONE è quella dello swipe: in alto a sinistra per la palla alta in zona 4, in alto a destra per la zona 2.
5. Un tocco breve senza trascinare fa la VELOCE, corta davanti a te.
Nei primi livelli i puntini bianchi ti mostrano la strada della palla: fai passare i puntini dentro il cerchio!
Il cerchio è dove la mano dell'attaccante colpisce la palla: se l'alzata è perfetta schiaccia forte in campo. Se è un po' fuori l'attaccante prova lo stesso, ma la palla può finire in rete o fuori; se è troppo sbagliata non ci arriva e la palla cade. Sulla palla alta l'attaccante si sposta e ci arriva anche se è un po' lontana.
Trucco per la palla alta: swipe deciso in alto e un po' verso sinistra, lungo circa metà schermo.
Dopo un errore compare un consiglio 💡 che ti dice cosa correggere.
Il MURO: quando un avversario salta davanti a un cerchio (rosso, 🧱 MURO) lì la schiacciata viene murata. Alza in un cerchio verde, dove il muro non c'è.
Le CHIAMATE: se un attaccante chiama uno schema (nuvoletta), alza proprio quello.`,how_receive:`Vedi il campo dall'alto: il battitore avversario è in alto. La ricezione ha 4 fasi.
1. SPOSTAMENTO: appoggia il dito e trascina il tuo giocatore sotto la palla (l'ombra a terra mostra dove cade; nei livelli alti compare più tardi). Più sei al posto giusto, più margine di errore avrai dopo.
2. CONTATTO: stacca il dito e TOCCA lo schermo quando la palla arriva alle braccia del giocatore. In anticipo o in ritardo la ricezione viene peggio, e se sbagli tanto la palla prende lo SPIGOLO e vola via. Se sei lontano ma il tempo è perfetto, il giocatore si butta in TUFFO e la prende lo stesso. Nei primi livelli un cerchio giallo si stringe sulla palla: tocca quando si chiude.
3. DIREZIONE: senza staccare il dito trascina verso il palleggiatore (il cerchio giallo vicino alla rete).
4. FORZA: più tieni premuto, più la palla va alta e lontana (barra a destra: stacca nella zona verde). Se la battuta è forte basta tenere poco.
Se hai fatto bene le prime fasi, la zona verde è più larga e gli errori di direzione contano meno.
Dopo ogni tocco un riquadro ti dice com'è andata ogni fase: posizione, tempo, potenza e direzione (verde = bene, giallo = quasi, rosso = da correggere).
Le battute float cambiano direzione a metà strada: aspetta prima di muoverti!`,how_dig:`Vedi il campo dall'alto: gli avversari sono in alto. Il tuo giocatore ha il numero della sua zona, i compagni sono più chiari.
1. POSIZIONE: mentre gli avversari alzano (barra in alto) trascina il giocatore nel suo posto di difesa. Il posto dipende da dove attaccano, da quanti dei tuoi saltano a muro e da dove si mette il muro:
• muro sulla parallela (verso la riga laterale): la palla va in diagonale, e chi è sulla linea (zona 1 o 5) viene avanti per il pallonetto dietro al muro;
• muro sulla diagonale (verso il centro): chi è sulla linea resta in fondo sulla linea, il centrale dietro (zona 6) si sposta verso la linea;
• senza muro: tutti in un semicerchio largo, i giocatori davanti a 3-4 metri dalla rete.
Guarda dove vanno i tuoi muri! Il posto giusto (cerchio tratteggiato) e l'ombra del muro si vedono solo dopo l'attacco. Più eri lontano dal posto giusto, meno punti prendi e più lontano arriva la palla.
2. DIFESA: basta UN TOCCO. Tocca il campo nella direzione in cui arriva la palla: vicino al giocatore è un passo, lontano è un tuffo. Tocca un attimo prima che la palla arrivi: il tempo e la direzione decidono la difesa. Nei primi due livelli un cerchio giallo si stringe sulla palla: tocca quando si chiude. Se tieni ancora il dito dallo spostamento, puoi anche farlo scivolare dove arriva la palla e staccarlo.
Dopo ogni attacco il riquadro ti dice com'è andata: posizione, tempo, distanza e direzione.`,how_attack:`Vedi il campo da dietro il tuo attaccante. L'alzatore non è perfetto: la palla può arrivare in posti un po' diversi. Il cerchio sul pavimento ti mostra dove staccare per prenderla.
1. PARTENZA: trascina il dito in orizzontale per spostare il punto da cui parti, a destra o a sinistra.
2. RINCORSA: senza staccare il dito, spingilo IN AVANTI (verso l'alto): l'attaccante parte subito e corre verso il punto che indichi col dito, verso il cerchio. Il percorso si vede a terra. Parti al momento giusto: sulla palla alta aspetta che scenda, sulla veloce parti subito.
3. SALTO: STACCA il dito per saltare (oppure tocca lo schermo se sei fermo). Il cerchio cambia colore: bianco = aspetta, giallo = preparati, VERDE = salta ora, rosso = è tardi.
4. COLPO: la palla si ferma vicino alla mano. Fai uno swipe in avanti per schiacciare (più è veloce più è forte; la direzione dello swipe è la direzione della palla), all'indietro per il pallonetto. I colpi nella direzione della rincorsa vengono più facili.
Dopo ogni colpo vedi rincorsa, tempo, potenza e direzione con un punteggio, e un consiglio 💡 su cosa correggere.`,how_block:`Vedi la rete da dietro il tuo muro: gli avversari sono di là. Il muro ha 3 fasi.
Tutto si fa con un solo tocco, senza staccare il dito.
1. SPOSTAMENTO: guarda dove alzano e TRASCINA il dito a destra o a sinistra: il tuo giocatore si sposta lungo la rete (alla velocità di un giocatore vero, quindi parti presto). Mettiti davanti al braccio dell'attaccante.
2. SALTO: poi porta il dito IN BASSO: il giocatore piega le gambe (barra a destra). Poi portalo veloce IN ALTO: salta. Più pieghi e più sei veloce verso l'alto, più salta in alto. Il tempo è fondamentale: devi essere in alto quando l'attaccante colpisce. Sulla palla alta aspetta, sulla veloce salta quasi insieme all'alzata.
3. MANI: dopo il salto, senza staccare (o con un nuovo tocco), trascina a destra o a sinistra per spostare le mani verso dove tira l'attaccante.
Muro a due: il tuo compagno mura all'esterno; chiudi accanto a lui, verso l'interno, ma senza spingerlo: se salti addosso a lui è fallo.
Nell'ultimo livello guarda la rincorsa dell'attaccante (linea rossa): se arriva dritto tira lungo la linea, se arriva in diagonale tira in diagonale.
Dopo ogni muro il riquadro ti dice com'è andata: posizione, elevazione, tempo e mani, con un punteggio per ognuno.`,how_athletic:`Tocca il cerchio più veloce che puoi finché non finisce il tempo.
La barra in alto mostra quanto manca per il punteggio pieno.`,lvn_s1:"Primo servizio",lvg_s1:"Metti la palla dentro il campo: vale tutto il campo. Il cerchio ti mostra dove cade.",lvn_s2:"Fondo campo",lvg_s2:"Prendi le zone in fondo al campo: serve più forza.",lvn_s3:"Tutte le zone",lvg_s3:"Il bersaglio può essere in qualsiasi zona: tocca la palla di lato per cambiare direzione.",lvn_s4:"Senza mirino",lvg_s4:"Niente cerchio di aiuto: regola punto di contatto e forza a occhio.",lvn_s5:"Top spin",lvg_s5:"Zone in fondo e almeno 55 km/h: swipe forte in su, il top spin la tiene dentro.",lvn_s6:"Foglia morta",lvg_s6:"Zone corte dietro la rete: swipe e ferma il dito prima di staccare, la flottante cade di colpo.",lvn_s7:"Effetto",lvg_s7:"Ti chiamano l'effetto a sinistra o a destra: swipe in diagonale per far curvare la palla nell'angolo.",lvn_s8:"Chiamate",lvg_s8:"Ogni battuta ti chiamano un effetto diverso: fai lo swipe giusto!",lvn_s9:"Precisione",lvg_s9:"Bersagli piccoli, tutti gli effetti, senza aiuti.",lvn_p1:"Palla alta",lvg_p1:"Sempre nello stesso posto: palla alta in zona 4. Segui i puntini!",lvn_p2:"Diversi posti",lvg_p2:"Il cerchio cambia posto: zona 4, zona 2 o dietro (pipe).",lvn_p3:"Veloce, mezza e alta",lvg_p3:"L'attaccante chiama veloce, mezza o alta: alza quella giusta.",lvn_p4:"Leggi il muro",lvg_p4:"Un muro salta davanti a un cerchio: alza dove è libero (verde).",lvn_p5:"Tutti gli schemi",lvg_p5:"Alta, mezza, veloce, pipe e super, con chiamate e muro, senza puntini.",lvn_r1:"Tempo e forza",lvg_r1:"La battuta arriva sempre su di te: non serve spostarti. Tocca quando il cerchio giallo si chiude e tieni premuto il giusto. La direzione è automatica.",lvn_r2:"Anche la direzione",lvg_r2:"Sempre su di te: dopo il tocco trascina anche verso il palleggiatore.",lvn_r3:"Un passo",lvg_r3:"La palla arriva poco lontano: spostati di un passo, poi tocca, direzione e forza.",lvn_r4:"Spostati di più",lvg_r4:"La palla arriva più lontano: corri sotto la palla prima di toccare.",lvn_r5:"Tuffo",lvg_r5:"Palle lontane: se il tempo è perfetto il giocatore si tuffa e la prende.",lvn_d1:"Il posto giusto",lvg_d1:"Senza muro: trova il tuo posto nel semicerchio. Dopo l'attacco vedi se era quello giusto.",lvn_d2:"Leggi il muro",lvg_d2:"C'è il muro: guarda dove si mette e trova il tuo posto. La palla arriva vicino.",lvn_d3:"Palle lontane",lvg_d3:"Come prima, ma la palla può arrivare lontano dal tuo posto: tocca lontano per tuffarti.",lvn_d4:"Pallonetti",lvg_d4:"Anche pallonetti corti dietro al muro.",lvn_d5:"Tocchi a muro",lvg_d5:"Anche palle che toccano il muro e volano alte verso il fondo.",lvn_a1:"Rincorsa e salto",lvg_a1:"Solo palla alta, senza muro: sposta la partenza, corri verso il cerchio e salta quando diventa verde.",lvn_a2:"Gli schemi",lvg_a2:"Il palleggiatore chiama alta, mezza, veloce o super: parti al momento giusto per ognuna.",lvn_a4:"Muro a due",lvg_a4:"Due muri: lo spazio libero è più piccolo.",lvn_a5:"Con la difesa",lvg_a5:"Muro a due e difensori in campo: tira forte lontano da loro.",lvn_a3:"Muro a uno",lvg_a3:"Un muro salta davanti a te: tira dove non c'è o fai il pallonetto.",lvn_b1:"Muro a uno",lvg_b1:"Solo palla alta in zona 4: spostati davanti all'attaccante e salta al momento giusto.",lvn_b2:"La veloce",lvg_b2:"Sei in zona 3 contro la veloce: salta quasi insieme all'alzata.",lvn_b4:"Muro a due",lvg_b4:"Il compagno mura all'esterno: chiudi accanto a lui senza spingerlo.",lvn_b5:"Le mani",lvg_b5:"Guarda la rincorsa: sposta le mani a destra o a sinistra per murare la parallela o la diagonale.",lvn_b3:"Leggi l'alzata",lvg_b3:"Da zona 3: veloce, mezza o alta. Guarda dove va la palla e spostati.",lvn_t1:"Riscaldamento",lvg_t1:"Tocca più veloce che puoi.",lvn_t2:"Sprint",lvg_t2:"Servono più tocchi.",lvn_t3:"Fulmine",lvg_t3:"Velocità massima!",next:"Avanti",prev:"Indietro",stepOf:"Passo {n} di {m}",playerOf:"Giocatore {n} di {m}",nextPlayer:"Prossimo giocatore",done:"Fatto",keepOthers:"Gli altri vanno bene così",customize:"Person your players. Arrows show who is improving.",tip_player:"Ratings grow with training and drop when not trained for 2 weeks.",tip_gym:"Choose what to train in each of the 3 sessions. Watch the energy!",tip_league:"Win 2-0 for 3 points. The top 4 reach the play-offs.",tip_prematch:"Pick the 6 starters: positions set the rotation.",tip_match:"You can call time-outs and make subs. The best rallies play in slow motion!",tip_editor:"Make the player look like your real teammate!",gotIt:"Got it",arcade:"Mini-games",arcadeHint:"Play for fun: scores here never change your team.",howToPlay:"How to play",level:"Level {n}",arcLocked:"Get at least 2 stars on the level before to unlock it.",arcBest:"Best: {n}%",arcNew:"New record!",arcUnlocked:"Level {n} unlocked!",arcAgain:"Play again",arcNext:"Next level",how_serve:`You stand on the baseline and see the court from behind.
1. Before the toss, drag left or right to move along the line.
2. Tap the screen to toss the ball up.
3. When the ball is in the yellow box TOUCH THE BALL: that is the hit. The middle of the box is the perfect moment.
4. The SPOT you touch on the ball decides where it goes: the middle goes straight; the left side sends it right and the right side sends it left; below goes higher and longer, above goes lower (net risk).
5. Without lifting, SWIPE: the longer and faster, the stronger (see the bar on the right). The swipe also gives the spin:
⤵ swipe up: topspin, the ball drops early. The harder you hit, the more it spins.
↰ ↱ swipe diagonally: side spin, the ball curves that way.
🍂 swipe and then STOP your finger before lifting it: float, no spin, the ball wobbles and drops suddenly after the net.
6. Lift your finger to serve. Hit the middle of the ball at the right moment and it always lands in: soft lands short, hard lands deep.
After the hit a panel shows where you touched the ball and where it was in the yellow box.
Score: the yellow zone is worth the most, the court less, net or out nothing.`,how_set:`You are the setter: the ball comes from the pass.
1. When the ball is near your hands PUT your finger down: the ball slows down.
2. SWIPE towards where you want the ball and lift your finger. You may hold before you start: only the swipe counts.
3. POWER comes from the swipe: the longer and faster you drag, the stronger the set (bar on top). Short and slow = soft ball.
4. DIRECTION is the swipe direction: up and left for a high ball to zone 4, up and right for zone 2.
5. A short tap without dragging is the QUICK, short in front of you.
In the first levels white dots show the ball path: get the dots through the circle!
The circle is where the hitter's hand meets the ball: a perfect set is spiked hard into the court. A little off and the hitter still tries, but the ball may go into the net or out; way off and the hitter cannot reach it and the ball drops. On a high ball the hitter moves and still gets there even if it is a bit far.
High ball trick: a firm swipe up and a bit left, about half the screen long.
After a mistake a 💡 tip tells you what to fix.
The BLOCK: when an opponent jumps in front of a circle (red, 🧱 BLOCK) the attack there is blocked. Set to a green circle, where there is no block.
CALLS: if a hitter calls a play (speech bubble), set exactly that.`,how_receive:`You see the court from above: the server is at the top. Reception has 4 steps.
1. MOVE: put your finger down and drag your player under the ball (its shadow shows where it lands; later on it appears late). The better your spot, the more room for error later.
2. CONTACT: lift your finger and TAP the screen when the ball reaches the player's arms. Early or late makes a worse pass, and way off the ball hits the EDGE of the arms and flies away. If you are far but your timing is perfect, the player DIVES and still gets it. In the first levels a yellow ring closes on the ball: tap when it closes.
3. DIRECTION: without lifting, drag towards the setter (the yellow circle near the net).
4. POWER: the longer you hold, the higher and longer the ball goes (bar on the right: lift in the green band). On a hard serve a short hold is enough.
If the first steps went well, the green band is wider and direction mistakes count less.
After every touch a panel tells you how each step went: position, timing, power and direction (green = good, yellow = nearly, red = fix it).
Float serves change direction halfway: wait before you move!`,how_dig:`You see the court from above: the opponents are at the top. Your player wears their zone number, teammates are paler.
1. POSITION: while the opponents set (bar on top) drag your player to their defence spot. The spot depends on where they attack from, how many of your players block and where the block stands:
• block on the line (towards the sideline): the ball goes cross, and the line player (zone 1 or 5) comes forward for the tip behind the block;
• block on the cross (towards the middle): the line player stays deep on the line, the back middle (zone 6) shifts towards the line;
• no block: everyone in a wide half circle, front players 3-4 metres from the net.
Watch where your blockers go! The right spot (dashed circle) and the block shadow show only after the attack. The further you were from the right spot, the fewer points and the further the ball lands.
2. DIG: ONE TAP is enough. Tap the court in the direction the ball is coming: close to the player is a step, far is a dive. Tap just before the ball arrives: timing and direction decide the dig. In the first two levels a yellow ring closes on the ball: tap when it closes. If your finger is still down from the move, you can also slide it to where the ball comes and lift it.
After every attack the panel tells you how it went: position, timing, distance and direction.`,how_attack:`You see the court from behind your hitter. The setter is not perfect: the ball can come down in slightly different places. The circle on the floor shows where to take off to reach it.
1. START: drag your finger sideways to move your starting point right or left.
2. RUN-UP: without lifting, push your finger FORWARD (up): the hitter sets off at once and runs towards the point your finger shows, towards the circle. The path shows on the floor. Start at the right moment: on a high ball wait for it to come down, on a quick go at once.
3. JUMP: LIFT your finger to jump (or tap the screen if you are standing). The circle changes colour: white = wait, yellow = get ready, GREEN = jump now, red = late.
4. HIT: the ball stops near the hand. Swipe forward to spike (faster = harder; the swipe direction is the ball direction), backward to tip. Shots along the run are easier.
After every hit you see run-up, timing, power and direction with a score, and a 💡 tip on what to fix.`,how_block:`You see the net from behind your blocker: the opponents are across it. The block has 3 steps.
Everything is one touch, without lifting your finger.
1. MOVE: watch where they set and DRAG your finger right or left: your player shuffles along the net (at a real player's pace, so start early). Stand in front of the hitter's arm.
2. JUMP: then bring your finger DOWN: the player bends the knees (bar on the right). Then flick it UP: the player jumps. The deeper the bend and the faster the flick, the higher the jump. Timing is everything: be at the top when the hitter hits. On a high ball wait, on a quick jump almost with the set.
3. HANDS: after the jump, without lifting (or with a new touch), drag right or left to move the hands towards where the hitter aims.
Double block: your teammate blocks on the outside; close next to them, on the inside, but do not push: jumping into them is a fault.
In the last level watch the hitter's approach (red line): straight in means the line, angled means the cross.
After every block the panel tells you how it went: position, height, timing and hands, each with a score.`,how_athletic:`Tap the circle as fast as you can until time runs out.
