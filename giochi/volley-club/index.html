Prima di lanciare puoi trascinare a destra o a sinistra per spostarti sulla riga.
Tocca lo schermo per lanciare la palla in alto.
Poi tocca la palla mentre è dentro il riquadro tratteggiato: è il momento giusto per colpirla forte.
Dove tocchi la palla conta: al centro va dritta, sotto va più lunga (o fuori), sopra va in rete. Se la tocchi a sinistra va a destra, a destra va a sinistra.
Se trascini il dito subito dopo il colpo dai rotazione: la palla scende prima, utile per le zone corte.
Punti: nel riquadro giallo vale il massimo, dentro il campo vale meno, rete o fuori vale zero.`,how_set:`Sei la palleggiatrice: la palla arriva dalla ricezione.
Quando è vicina alle tue mani, tieni premuto: la barra in alto mostra la forza.
Mentre tieni premuto, trascina il dito nella direzione in cui vuoi mandare la palla.
Lascia il dito per alzare. Un tocco breve senza trascinare fa una veloce, corta davanti a te.
Devi far passare la palla dentro il cerchio (il canestro) dove salta l'attaccante.
Con più schemi vedi più canestri: alta, mezza, veloce, pipe, super. Guarda il muro avversario: dove c'è un giocatore alto conviene una palla veloce o un'altra zona.
Quando un attaccante chiama uno schema (fumetto), devi alzare proprio quello.`,how_receive:`Vedi il campo dall'alto: il battitore avversario è in alto.
Appoggia il dito e trascina il tuo giocatore: ti segue.
Portalo sotto la palla: l'ombra a terra mostra dove cadrà (nei livelli alti compare più tardi).
Stacca il dito quando la palla arriva all'altezza giusta, poco prima che tocchi terra.
Più sei preciso, più la palla arriva vicino al palleggiatore (il cerchio giallo vicino alla rete).
Le battute float cambiano direzione a metà strada: aspetta prima di muoverti!`,how_dig:`Vedi il campo dall'alto. L'attaccante avversario è oltre la rete, i tuoi due muri sono davanti a lui.
1. Posizionati: hai pochi secondi (barra in alto) per trascinare il difensore dove pensi arriverà la palla. Quando si chiama il muro, la zona scura è coperta: mettiti fuori da lì.
2. Muoviti: quando l'attaccante colpisce, fai uno swipe nella direzione della palla. Uno swipe lungo è un tuffo: arrivi più lontano, ma solo una volta.
3. Colpisci: tocca lo schermo quando la palla è bassa, vicino a te.
Attenzione ai pallonetti: cadono corti, vicino alla rete. Si parte ogni volta da una zona diversa.`,how_attack:`L'attaccante salta da solo: guarda dove è il muro (il blocco rosso).
Quando sei in alto, scorri il dito verso il lato libero: sinistra, dritto o destra.
Se vai contro il muro vale poco. Più il colpo è vicino al punto più alto del salto, più vale.`,how_block:`L'attaccante avversario rincorre e salta.
Tocca lo schermo per saltare a muro: il tuo salto deve arrivare in alto insieme al suo.
Se salti troppo presto o troppo tardi, l'attacco passa.`,how_athletic:`Tocca il cerchio più veloce che puoi finché non finisce il tempo.
