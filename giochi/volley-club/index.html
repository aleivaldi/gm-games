1. Prima di lanciare trascina a destra o a sinistra per spostarti sulla riga, e scegli l'effetto con i pulsanti in basso.
2. Tocca lo schermo per lanciare la palla in alto.
3. Quando la palla è nel riquadro tratteggiato APPOGGIA il dito: è il momento del colpo. Se sei in anticipo o in ritardo la palla va meno forte e meno precisa.
4. Tenendo il dito giù TRASCINA: verso l'alto = più FORZA (guarda la barra a destra), a destra o a sinistra = DIREZIONE (segui la freccia gialla). Nei primi livelli un cerchio sul campo mostra dove cadrà.
5. Stacca il dito per battere. Poca forza = rete, troppa = fuori.
Effetti:
● Normale: la battuta base.
⤵ Top spin: la palla gira in avanti e scende presto: puoi tirare più forte senza andare fuori.
🍂 Flottante (foglia morta): niente rotazione, la palla balla e dopo la rete cade di colpo: ottima per le zone corte.
↰ ↱ Effetto: la palla curva verso sinistra o destra, per prendere gli angoli.
Punti: nel riquadro giallo vale il massimo, dentro il campo meno, rete o fuori zero.`,how_set:`Sei la palleggiatrice: la palla arriva dalla ricezione.
1. Quando la palla è vicina alle tue mani APPOGGIA il dito e tienilo premuto: più lo tieni, più la palla va forte (barra in alto).
2. Mentre tieni premuto TRASCINA il dito verso dove vuoi mandare la palla: in alto a sinistra per la palla alta in zona 4, in alto a destra per la zona 2.
3. Stacca il dito per alzare. Nei primi livelli i puntini bianchi ti mostrano la strada della palla: fai passare i puntini dentro il cerchio!
4. Un tocco breve senza trascinare fa la VELOCE, corta davanti a te.
Trucco per la palla alta: trascina in alto e un po' verso sinistra, tieni premuto circa mezzo secondo, guarda i puntini e stacca quando passano nel cerchio.
Dopo un errore compare un consiglio 💡 che ti dice cosa correggere.
Il MURO: quando un avversario salta davanti a un cerchio (rosso, 🧱 MURO) lì l'attacco viene murato. Alza in un cerchio verde, dove il muro non c'è.
Le CHIAMATE: se un attaccante chiama uno schema (nuvoletta), alza proprio quello.`,how_receive:`Vedi il campo dall'alto: il battitore avversario è in alto.
Appoggia il dito e trascina il tuo giocatore: ti segue.
Portalo sotto la palla: l'ombra a terra mostra dove cadrà (nei livelli alti compare più tardi).
Puoi staccare e riappoggiare il dito quante volte vuoi. Il bagher parte da solo quando la palla scende all'altezza delle braccia: conta solo essere al posto giusto, cioè con la palla al centro del tuo cerchio.
Più sei preciso, più la palla arriva vicino al palleggiatore (il cerchio giallo vicino alla rete).
Le battute float cambiano direzione a metà strada: aspetta prima di muoverti!`,how_dig:`Vedi il campo dall'alto. L'attaccante avversario è oltre la rete, i tuoi due muri sono davanti a lui.
1. Posizionati: hai pochi secondi (barra in alto) per trascinare il difensore dove pensi arriverà la palla. Quando si chiama il muro, la zona scura è coperta: mettiti fuori da lì.
2. Muoviti: quando l'attaccante colpisce, fai uno swipe nella direzione della palla. Uno swipe lungo è un tuffo: arrivi più lontano, ma solo una volta.
3. Colpisci: tocca lo schermo quando la palla è bassa, vicino a te.
Attenzione ai pallonetti: cadono corti, vicino alla rete. Si parte ogni volta da una zona diversa.`,how_attack:`L'attaccante salta da solo: guarda dove è il muro (il blocco rosso).
Quando sei in alto, scorri il dito verso il lato libero: sinistra, dritto o destra.

id file: {err}",exported:"Save downloaded",tip_home:"Every week: first the Gym, then the League match.",tip_squad:"Here are your players. Arrows show who is improving.",tip_player:"Ratings grow with training and drop when not trained for 2 weeks.",tip_gym:"Choose what to train in each of the 3 sessions. Watch the energy!",tip_league:"Win 2-0 for 3 points. The top 4 reach the play-offs.",tip_prematch:"Pick the 6 starters: positions set the rotation.",tip_match:"You can call time-outs and make subs. The best rallies play in slow motion!",tip_editor:"Make the player look like your real teammate!",gotIt:"Got it",arcade:"Mini-games",arcadeHint:"Play for fun: scores here never change your team.",howToPlay:"How to play",level:"Level {n}",arcLocked:"Get at least 2 stars on the level before to unlock it.",arcBest:"Best: {n}%",arcNew:"New record!",arcUnlocked:"Level {n} unlocked!",arcAgain:"Play again",arcNext:"Next level",how_serve:`You stand on the baseline and see the court from behind.
1. Before the toss, drag left or right to move along the line, and pick the effect with the buttons at the bottom.
2. Tap the screen to toss the ball up.
3. When the ball is in the dotted box PUT your finger down: that is the moment of the hit. Too early or too late and the ball is slower and less accurate.
4. Keep your finger down and DRAG: up = more POWER (see the bar on the right), left or right = DIRECTION (follow the yellow arrow). In the first levels a circle on the court shows where it will land.
5. Lift your finger to serve. Too little power = net, too much = out.
Effects:
● Normal: the basic serve.
⤵ Topspin: the ball spins forward and drops early, so you can hit harder and stay in.
🍂 Float: no spin, the ball wobbles and drops suddenly after the net: great for short zones.
↰ ↱ Side spin: the ball curves left or right, to reach the corners.
Score: the yellow box is worth the most, the court less, net or out nothing.`,how_set:`You are the setter: the ball comes from the pass.
1. When the ball is near your hands PUT your finger down and hold: the longer you hold, the stronger the set (bar on top).
2. While holding, DRAG towards where you want the ball: up and left for a high ball to zone 4, up and right for zone 2.
3. Lift your finger to set. In the first levels white dots show the ball path: get the dots through the circle!
4. A short tap without dragging is the QUICK, short in front of you.
High ball trick: drag up and a bit left, hold about half a second, watch the dots and let go when they pass through the circle.
After a mistake a 💡 tip tells you what to fix.
The BLOCK: when an opponent jumps in front of a circle (red, 🧱 BLOCK) the attack there is blocked. Set to a green circle, where there is no block.
CALLS: if a hitter calls a play (speech bubble), set exactly that.`,how_receive:`You see the court from above: the server is at the top.
Put your finger down and drag your player: they follow it.
Get under the ball: its shadow shows where it will land (later on, it appears late).
You can lift and put your finger down as often as you like. The pass happens by itself when the ball drops to arm height: what counts is being in the right place, with the ball in the middle of your circle.
The better you are, the closer the ball goes to the setter (the yellow circle near the net).
Float serves change direction halfway: wait before you move!`,how_dig:`You see the court from above. The hitter is across the net, your two blockers in front of them.
1. Get in position: you have a few seconds (bar on top) to drag the defender where you think the ball will go. When a block is called, the dark area is covered: stay out of it.
2. Move: when the hitter strikes, swipe towards the ball. A long swipe is a dive: you reach further, but only once.
3. Dig: tap the screen when the ball is low, close to you.
Watch out for tips: they drop short, near the net. Each ball starts from a different zone.`,how_attack:`The hitter jumps on their own: see where the block is (the red wall).
At the top of the jump, swipe towards the open side: left, straight or right.
Hitting into the block is worth little. The closer to the top of the jump, the better.`,how_block:`The other hitter runs in and jumps.
Tap the screen to jump and block: your jump must peak together with theirs.
Too early or too late and the attack gets through.`,how_athletic:`Tap the circle as fast as you can until time runs out.
