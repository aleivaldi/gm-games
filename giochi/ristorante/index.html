<style>
/* Layout: one screen. A canvas draws the top-down floor plan (kitchen, dining rooms, entrance); HTML layers on top hold HUD, menus, shop and dialogs.
   Single "grand hotel" look on purpose: deep green and burgundy, gold trim, white tablecloths. */
:root{
  --green:#0F3D2E;--green2:#17543F;--green3:#226B51;
  --burg:#7B1E34;--burg2:#A02C48;
  --gold:#D9A93B;--gold2:#F3D88A;--gold3:#9C7421;
  --cream:#FFF7E8;--paper:#FFFDF8;--line:#E8D9B5;
  --ink:#1D2A23;--ink2:#5E6B63;
  --red:#C8303C;--ok:#2E9457;
  --scrim:rgba(6,22,16,.68);
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.nolinks .lnk{display:none!important}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{background:var(--green);color:var(--ink);font-family:var(--body);font-weight:700;font-size:16px;line-height:1.35;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
.emo{font-family:var(--emoji);font-weight:400;line-height:1}
.gutter{padding-left:16px;padding-right:16px}

/* buttons */
.btn{font-family:var(--body);font-weight:900;font-size:1.05rem;line-height:1.1;border:2px solid var(--gold3);background:var(--paper);color:var(--green);border-radius:999px;padding:.6em 1.2em;min-height:48px;box-shadow:0 4px 0 var(--gold3);display:inline-flex;align-items:center;justify-content:center;gap:.45em;text-align:center;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold3)}
.btn.primary{background:linear-gradient(#A02C48,#7B1E34);color:#FFF4DA;border-color:var(--gold);box-shadow:0 4px 0 #4E1020}
.btn.primary:active{box-shadow:0 1px 0 #4E1020}
.btn.gold{background:linear-gradient(#F6DC8E,#D9A93B);color:#3B2A0A;border-color:var(--gold3)}
.btn.big{font-size:1.3rem;padding:.65em 1.8em;min-height:60px}
.btn.small{font-size:.92rem;min-height:40px;padding:.4em .9em;box-shadow:0 3px 0 var(--gold3)}
.btn[disabled]{opacity:.45;cursor:default}
.btn[disabled]:active{transform:none}
.icon-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:rgba(255,253,248,.1);color:var(--gold2);display:grid;place-items:center;flex:none;padding:0}
.icon-btn svg{width:22px;height:22px}
.icon-btn.light{background:var(--paper);color:var(--green);border-color:var(--gold3)}
.lang{display:flex;gap:6px;flex-wrap:wrap}
.lang button{font-weight:900;font-size:.8rem;letter-spacing:.06em;border:2px solid var(--gold);background:transparent;color:var(--gold2);border-radius:10px;padding:.3em .55em;min-height:36px;min-width:42px}
.lang button[aria-pressed="true"]{background:var(--gold);color:var(--green)}
.lang.dark button{color:var(--green);border-color:var(--gold3)}
.lang.dark button[aria-pressed="true"]{background:var(--green);color:var(--gold2);border-color:var(--green)}
.coin{display:inline-block;width:1.05em;height:1.05em;vertical-align:-.15em;flex:none}
.star{display:inline-block;width:1em;height:1em;vertical-align:-.12em;flex:none}

/* HUD */
.hud{flex:none;display:flex;align-items:center;gap:8px;padding-block:7px;background:linear-gradient(#0A2C21,#0F3D2E);border-bottom:2px solid var(--gold3);color:var(--cream);position:relative;z-index:5}
.hud .icon-btn{width:40px;height:40px}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,247,232,.08);border:1.5px solid rgba(217,169,59,.55);border-radius:999px;padding:.2em .7em;min-height:36px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill .coin{width:20px;height:20px}
.timer{flex:1;min-width:0;max-width:340px;position:relative;overflow:hidden;justify-content:center}
.timer .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--gold);width:100%;transform-origin:left;transition:background .3s}
.timer.low{border-color:#FF7A7A;color:#FFD0D0}
.timer.low .bar{background:#FF6464}
.hstars{display:flex;gap:1px}
.hstars .star{width:18px;height:18px}
.dayl{font-family:var(--display);font-weight:900;color:var(--gold2);font-size:1.02rem;white-space:nowrap}
.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.18)}}
#stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
.hint{position:absolute;left:50%;top:8px;transform:translateX(-50%);background:rgba(10,36,27,.9);color:var(--cream);border:1.5px solid var(--gold);border-radius:999px;padding:.45em 1em;font-weight:800;font-size:.95rem;max-width:calc(100% - 24px);text-align:center;pointer-events:none;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.hint .emo{font-size:1.1em}

/* overlays and cards */
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding-block:14px;z-index:20}
.card{background:var(--cream);border:2px solid var(--gold);outline:1px solid var(--gold3);outline-offset:-7px;border-radius:22px;box-shadow:0 14px 40px rgba(0,0,0,.4);width:min(620px,100%);max-height:100%;overflow:auto;padding:22px 20px;-webkit-overflow-scrolling:touch}
.card h2{font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,6.5vw,2.3rem);line-height:1.05;margin:0 0 6px;text-align:center;color:var(--green);text-wrap:balance}
.card p{margin:0}
.card .sub{text-align:center;color:var(--ink2);font-weight:700;margin-bottom:12px;text-wrap:balance}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.lead{text-align:center;font-weight:800;font-size:1.05rem;text-wrap:balance}
.legend{display:grid;gap:8px;margin:12px 0 2px;padding:0;list-style:none}
.legend li{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:5px 10px;font-weight:700;font-size:.9rem;line-height:1.25}
@media (min-width:620px){.legend{grid-template-columns:1fr 1fr}.legend li:last-child{grid-column:1/-1}}
.legend .emo{font-size:1.35rem;width:1.5em;text-align:center;flex:none}
.sum{display:grid;gap:4px;margin:10px 0 14px}
.sum div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 4px;border-bottom:1px dashed var(--line);font-weight:800}
.sum div b{font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px;white-space:nowrap}
.sum .neg b{color:var(--red)}
.sum .pos b{color:var(--ok)}
.sum .tot{border-bottom:0;border-top:2px solid var(--gold);font-size:1.15rem;margin-top:4px}
.guess{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin:8px 0 12px}
.gc{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:4px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.8rem;color:var(--ink2);position:relative;min-width:0}
.gc canvas{width:100%;max-width:110px;height:auto;aspect-ratio:1}
.gc .meta{display:flex;align-items:center;gap:4px;white-space:nowrap}
.gc .meta .emo{font-size:1.1rem}
.gc.right{border-color:var(--ok);background:#E9F7EE;box-shadow:0 0 0 3px rgba(46,148,87,.3)}
.gc.wrong{border-color:var(--red);background:#FCEBEC}
.gc.critic::after{content:attr(data-badge);position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--green);color:var(--gold2);border-radius:999px;padding:1px 9px;font-size:.75rem;white-space:nowrap}
.result{border-radius:16px;padding:12px;text-align:center;font-weight:900;font-size:1.1rem;margin-bottom:12px}
.result.good{background:#E9F7EE;color:#1E6B3E;border:2px solid var(--ok)}
.result.bad{background:#FCEBEC;color:#8E1F2A;border:2px solid var(--red)}
.result small{display:block;font-weight:800;font-size:.92rem;margin-top:4px}
.confirm{background:#FFF0F0;border:2px dashed var(--red);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.sticky{position:sticky;bottom:-22px;margin:10px -20px -22px;padding:12px 20px 16px;background:linear-gradient(rgba(255,247,232,0),var(--cream) 35%);display:flex;justify-content:center}
.muted{color:var(--ink2);font-weight:700;font-size:.9rem;text-align:center}

/* home */
.home{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 40%,rgba(15,61,46,.55),rgba(6,22,16,.88));overflow:auto;padding-block:12px 18px}
.home-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.home-mid{flex:1;display:flex;align-items:center;justify-content:center;padding-block:12px}
.home-card{width:min(520px,100%);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.tstars{display:flex;gap:6px;justify-content:center}
.tstars .star{width:30px;height:30px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.3))}
.logo{font-family:var(--display);font-weight:900;font-size:clamp(2.3rem,10vw,4rem);line-height:.98;color:var(--gold2);text-shadow:0 3px 0 #4E1020,0 0 24px rgba(243,216,138,.35);margin:0;text-wrap:balance}
.by{color:var(--cream);font-weight:800;letter-spacing:.04em;opacity:.9}
.namebox{background:var(--cream);border:2px solid var(--gold);border-radius:20px;padding:14px;width:100%;display:flex;flex-direction:column;gap:10px}
.namebox label{font-weight:900;color:var(--green)}
.field{font-family:var(--display);font-weight:700;font-size:1.3rem;border:2px solid var(--gold3);border-radius:14px;padding:.45em .8em;width:100%;background:#fff;color:var(--green);min-height:52px;text-align:center;user-select:text;-webkit-user-select:text}
.field::placeholder{color:#B9AE97}
.saved{background:var(--cream);border:2px solid var(--gold);border-radius:20px;padding:12px 14px;width:100%;display:flex;flex-direction:column;gap:4px;align-items:center}
.saved .nm{font-family:var(--display);font-weight:900;font-size:1.5rem;color:var(--burg);line-height:1.1;overflow-wrap:anywhere}
.saved .st{display:flex;gap:10px;align-items:center;font-weight:900;color:var(--green);font-variant-numeric:tabular-nums}
.home-actions{display:flex;flex-direction:column;gap:10px;align-items:center}
.portal{color:var(--gold2);font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:8px}

/* shop */
.shop{position:absolute;inset:0;z-index:10;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--green);background-image:radial-gradient(rgba(217,169,59,.13) 1.5px,transparent 1.6px);background-size:22px 22px}
.shop-in{max-width:1080px;margin:0 auto;padding-block:12px 110px;display:flex;flex-direction:column;gap:14px}
.shop-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--cream)}
.shop-head h2{font-family:var(--display);font-weight:900;font-size:clamp(1.4rem,5.5vw,2.1rem);margin:0;line-height:1.05;color:var(--gold2);flex:1;min-width:0;overflow-wrap:anywhere}
.shop-head .tools{display:flex;gap:8px;align-items:center}
.shop-stats{display:flex;gap:8px;flex-wrap:wrap;color:var(--cream)}
.shop-grid{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:760px){.shop-grid{grid-template-columns:1fr 1fr}}
.sec{background:var(--cream);border:2px solid var(--gold);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sec h3{font-family:var(--display);font-weight:900;font-size:1.35rem;margin:0;color:var(--green)}
.sec .note{color:var(--ink2);font-size:.88rem;font-weight:700;margin:-6px 0 0}
.item{display:flex;align-items:center;gap:10px;background:var(--paper);border:1.5px solid var(--line);border-radius:16px;padding:8px 10px;min-width:0}
.item .ic{width:48px;height:48px;flex:none;display:grid;place-items:center;font-size:2rem;border-radius:12px;background:#F4EBD6}
.item .ic canvas{width:48px;height:48px}
.item .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .nm{font-weight:900;color:var(--ink);line-height:1.15}
.item .ds{font-size:.82rem;color:var(--ink2);font-weight:700;line-height:1.2}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.item .btn.small{padding:.35em .7em;font-size:.88rem;min-height:40px;gap:.3em}
.item.lock{opacity:.6}
.item.new{border-color:var(--gold);box-shadow:0 0 0 3px rgba(217,169,59,.35)}
.tag{display:inline-block;background:var(--green);color:var(--gold2);font-size:.72rem;font-weight:900;border-radius:999px;padding:1px 8px;vertical-align:1px;margin-left:4px}
.qty{font-variant-numeric:tabular-nums;font-weight:900;color:var(--green)}
.qty.zero{color:var(--red)}
.warn{background:#FFF0F0;border:2px solid var(--red);color:#8E1F2A;border-radius:14px;padding:8px 12px;font-weight:800;text-align:center}
.shop-bar{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;gap:10px;align-items:center;justify-content:space-between;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(rgba(10,44,33,.0),rgba(10,44,33,.96) 30%)}
.shop-bar .btn.big{flex:1;max-width:460px;margin-left:auto}

/* win */
.win h2{font-size:clamp(2.2rem,9vw,3.4rem);color:var(--burg)}
.win .tstars .star{width:44px;height:44px}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--burg);color:#FFF4DA;border:2px solid var(--gold);font-weight:800;padding:.6em 1.1em;border-radius:999px;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.35);pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:480px){
  .dayl{display:none}
  .hstars .star{width:15px;height:15px}
  .pill{padding:.2em .55em;gap:4px;font-size:.92rem}
  .hud{gap:6px}
  .item{flex-wrap:wrap}
  .item .acts{width:100%}
  .item .acts .btn{flex:1}
  .hint{font-size:.82rem;padding:.35em .8em}
}
@media (max-width:370px){.hstars{display:none}#hStarsN{display:inline!important}}
@media (max-height:520px){
  .home-mid{padding-block:4px}
  .home-card{gap:8px}
  .logo{font-size:clamp(1.8rem,6vw,2.6rem)}
  .tstars .star{width:22px;height:22px}
  .btn.big{font-size:1.15rem;min-height:50px}
  .card{padding:14px}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.pop{animation:none}.confetti{display:none}}

/* ---------------- platform + storage ---------------- */
/* Portal SDKs (ads, cloud saves, language) arrive as window.GamePlatform in the per-platform builds. */
const GP=window.GamePlatform||{};
function store(){try{const s=GP.storage&&GP.storage();if(s)return s}catch(e){console.warn('Platform storage unavailable',e)}return localStorage}
const LS={
  get(k,d){try{const v=store().getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{store().setItem(k,JSON.stringify(v));return true}catch(e){return false}},
  del(k){try{store().removeItem?store().removeItem(k):store().setItem(k,'null')}catch(e){console.warn('Save not removed',e)}}
};
const SAVE_KEY='r5-save',LANG_KEY='r5-lang',SOUND_KEY='r5-sound';
const LINKS=!GP.noLinks;
function detectLang(){let l=null;try{l=GP.locale&&GP.locale()}catch(e){l=null}const n=String(l||navigator.language||'en').slice(0,2).toLowerCase();return LANGS.includes(n)?n:'en'}
let lang=LS.get(LANG_KEY,null);if(!LANGS.includes(lang))lang=detectLang();
function T(k,v){let s=k==='title'?GAME_TITLE[lang]:((STR[lang]&&STR[lang][k])||STR.it[k]||k);if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}
function dishName(id){return DISH_NAMES[id][lang]||DISH_NAMES[id].it}

/* ---------------- helpers ---------------- */
const $=s=>document.querySelector(s);
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=n=>Math.floor(Math.random()*n);
const pick=a=>a[rand(a.length)];
const RM=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const quiet=p=>{if(p&&p.catch)p.catch(()=>{})};
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(.1,r),0,TAU)}
function shade(h,a){const n=parseInt(h.slice(1),16),c=[n>>16,(n>>8)&255,n&255].map(v=>Math.round(a<0?v*(1+a):v+(255-v)*a));return'rgb('+c.join(',')+')'}
function hash(a,b){let h=(a*374761393+b*668265263)>>>0;h=(h^(h>>>13))*1274126177>>>0;return h}
const STAR_D='M12 2.2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17l-5.9 3.3 1.3-6.6L2.5 9.1l6.6-.8z';
const starSvg=on=>`<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_D}" fill="${on?'#F3C54A':'rgba(255,255,255,.18)'}" stroke="${on?'#9C7421':'rgba(243,216,138,.6)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const COIN='<svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.5" fill="#F2C94C" stroke="#9C7421" stroke-width="1.8"/><circle cx="12" cy="12" r="7" fill="none" stroke="#C99A2E" stroke-width="1.3"/><path d="M12 7.6l1.3 2.7 3 .4-2.2 2 .6 3-2.7-1.5-2.7 1.5.6-3-2.2-2 3-.4z" fill="#C99A2E"/></svg>';
function stars5(n){let s='';for(let i=0;i<CFG.starsToWin;i++)s+=starSvg(i<n);return s}

/* ---------------- save ---------------- */
let S=null;
function freshSave(name){return{v:1,name,day:1,coins:CFG.startCoins,stars:0,maxStars:0,tables:CFG.startTables,furniture:false,chandelier:false,room:false,terrace:false,
  helpers:{host:0,cleaner:0,waiter:0,chef:0},stock:Object.assign({},CFG.starterStock),seen:CFG.dishes.filter(d=>d.stars===0).map(d=>d.id),won:false,gifts:[]}}
function loadSave(){const s=LS.get(SAVE_KEY,null);if(!s||s.v!==1||typeof s.name!=='string')return null;
  const f=freshSave(s.name);const o=Object.assign(f,s);o.helpers=Object.assign(freshSave('').helpers,s.helpers||{});o.stock=Object.assign({},s.stock||{});o.seen=Array.isArray(s.seen)?s.seen:f.seen;return o}
let saveWarned=false;
function persist(){if(!LS.set(SAVE_KEY,S)&&!saveWarned){saveWarned=true;toast(T('saveFail'))}}
const unlocked=()=>CFG.dishes.filter(d=>d.stars<=S.maxStars);
const capacity=()=>CFG.rooms.base+(S.room?CFG.rooms.room:0)+(S.terrace?CFG.rooms.terrace:0);
const helperCost=k=>Math.round(CFG.helpers[k].cost*Math.pow(CFG.extraHelperMult,S.helpers[k])/5)*5;
const tableCost=()=>CFG.table.cost+CFG.table.step*(S.tables-CFG.startTables);
const wagesTotal=()=>HELPER_KINDS.reduce((a,k)=>a+S.helpers[k]*CFG.helpers[k].wage,0);
const tipRate=()=>CFG.tipBase+(S.chandelier?CFG.tipPerk:0)+(S.terrace?CFG.tipPerk:0);
function arrivalGap(){const a=CFG.arrival;return Math.max(a.min,a.base+a.perTable*S.tables)*(1-a.jitter+Math.random()*a.jitter*2)}
function expectedCustomers(){const a=CFG.arrival;return Math.round((CFG.dayLength-CFG.lastArrival)/Math.max(a.min,a.base+a.perTable*S.tables))+1}
function unlockDishes(){const out=[];for(const d of unlocked())if(!S.seen.includes(d.id)){S.seen.push(d.id);S.stock[d.id]=(S.stock[d.id]||0)+CFG.newDishGift;out.push(d.id)}return out}

/* ---------------- audio ---------------- */
let actx=null,soundOn=LS.get(SOUND_KEY,true)!==false,adPlaying=false,noiseBuf=null;

/* ---------------- day state ---------------- */
let D=null,mode='home',paused=false,uid=0;
function startDay(){
  closeOv();
  D={t:0,len:CFG.dayLength,next:1,spawned:0,criticAt:1+rand(3),criticSpawned:false,customers:[],all:[],queue:[],sel:null,
    tables:[],tickets:[],stoves:[],helpers:[],floats:[],parts:[],coins:S.coins,stock:Object.assign({},S.stock),
    stats:{served:0,revenue:0,tips:0,bad:0,unserved:0,criticAngry:false},ended:false,endT:0,lastOrders:false,tick:-1,hintT:0,summaryShown:false};
  for(let i=0;i<S.tables;i++)D.tables.push({dirty:false,cust:null,claim:null,plate:null,seed:rand(1e6)});
  for(let i=0;i<CFG.playerStoves;i++)D.stoves.push({owner:null,tk:null});
  for(const k of HELPER_KINDS)for(let n=0;n<S.helpers[k];n++){const h={kind:k,idx:n,x:0,y:0,task:null,phase:0,t:0,carry:null,look:staffLook(k,n),walk:0,moving:false};
    if(k==='chef'){h.stove=D.stoves.length;D.stoves.push({owner:h,tk:null})}D.helpers.push(h)}
  showScreen('service');layout();
  D.helpers.forEach(h=>{const p=helperHome(h);h.x=p.x;h.y=p.y});
  mode='service';paused=false;updHud(true);sfx.start();
  if(GP.gameplayStart)GP.gameplayStart();keepAwake(true);
}
function patMax(k){return CFG.patience[k]*(S.furniture?CFG.furniturePatience:1)}
function resetPat(c,k){if(c.patMax)c.mood.push(clamp(c.pat/c.patMax,0,1));c.patMax=patMax(k);c.pat=c.patMax}
function spawn(){const rem=D.len-D.t;const critic=!D.criticSpawned&&(D.spawned>=D.criticAt||rem<CFG.lastArrival+16);
  const c={id:++uid,n:D.spawned+1,look:uniqueLook(),critic,st:'queue',x:L.out.x,y:L.out.y,pat:0,patMax:0,mood:[],t:0,table:-1,seatNo:0,dish:null,tk:null,claim:null,
    hint:null,hintT:0,hintNext:1.5+Math.random()*2,walk:0,spd:CFG.walk,angry:false,gone:false,blinkT:Math.random()*4};
  if(critic)D.criticSpawned=true;D.spawned++;resetPat(c,'queue');c.mood=[];D.customers.push(c);D.all.push(c);D.queue.push(c)}
function moveTo(o,tx,ty,spd,dt){const dx=tx-o.x,dy=ty-o.y,d=Math.hypot(dx,dy),st=spd*dt;if(d<=st||d<.5){o.x=tx;o.y=ty;o.walk=0;return true}o.x+=dx/d*st;o.y+=dy/d*st;o.walk=(o.walk||0)+dt*11;return false}
const SEATED=['menu','order','food','eat','bill'];
function seat(c,ti,helper){const t=D.tables[ti];if(t.cust||c.st!=='queue')return false;const qi=D.queue.indexOf(c);if(qi>=0)D.queue.splice(qi,1);
  t.cust=c;if(t.claim&&t.claim!==helper)t.claim=null;c.claim=null;c.table=ti;c.seatNo=ti+1;c.st='walk';c.mood.push(clamp(c.pat/c.patMax,0,1));c.spd=helper?CFG.helperSpeed*.95:CFG.playerWalk;
  if(D.sel===c)D.sel=null;sfx.seat();return true}
function arriveTable(c){const t=D.tables[c.table];if(t.dirty){toast(T('dirtyAngry'));leave(c,true);return}c.st='menu';c.t=CFG.menuTime}
function takeOrder(c){if(c.st!=='order')return;const d=pick(unlocked());c.dish=d.id;const tk={id:++uid,c,dish:d.id,st:'pending',t:0,stove:-1,claim:null,carried:null};D.tickets.push(tk);c.tk=tk;c.st='food';c.claim=null;resetPat(c,'food');sfx.order();
  const p=seatPos(c.table);float(p.x,p.y-L.hr*3,d.emoji,'#FFFFFF',true)}
function freeStove(owner){return D.stoves.findIndex(s=>!s.tk&&(owner===undefined?!s.owner:s.owner===owner))}
function startCook(tk,si){if(tk.st!=='pending'||(D.stock[tk.dish]||0)<=0)return false;D.stock[tk.dish]--;tk.st='cooking';tk.t=0;tk.stove=si;D.stoves[si].tk=tk;sfx.cook();return true}
function playerCook(tk){if(tk.st!=='pending')return;if((D.stock[tk.dish]||0)<=0){toast(T('noStock',{dish:dishName(tk.dish)}));sfx.no();return}
  let si=freeStove();if(si<0)si=D.stoves.findIndex(s=>!s.tk);if(si<0){toast(T('stovesBusy'));sfx.no();return}startCook(tk,si)}
function removeTicket(tk){const i=D.tickets.indexOf(tk);if(i>=0)D.tickets.splice(i,1);if(tk.stove>=0&&D.stoves[tk.stove].tk===tk)D.stoves[tk.stove].tk=null;if(tk.carried){tk.carried.carry=null;tk.carried=null}if(tk.c.tk===tk)tk.c.tk=null}
function serveTicket(tk){const c=tk.c;if(tk.st!=='ready'||c.st!=='food')return;removeTicket(tk);c.st='eat';c.t=c.critic?CFG.criticEatTime:CFG.eatTime;c.mood.push(clamp(c.pat/c.patMax,0,1));c.claim=null;D.tables[c.table].plate=tk.dish;sfx.serve()}
function collect(c){if(c.st!=='bill')return;const d=DISH[c.dish];c.mood.push(clamp(c.pat/c.patMax,0,1));const mood=c.mood.reduce((a,b)=>a+b,0)/Math.max(1,c.mood.length);
  const tip=Math.max(1,Math.round(d.price*tipRate()*(.4+.6*mood)));D.coins+=d.price+tip;D.stats.revenue+=d.price;D.stats.tips+=tip;D.stats.served++;
  const t=D.tables[c.table];t.dirty=true;t.plate=null;const p=seatPos(c.table);float(p.x,p.y-L.hr*2.4,'+'+(d.price+tip),'#F3D88A');burst(p.x,p.y-L.hr,10,['#F3C54A','#FFE89A','#D9A93B']);sfx.coin();updHud();popEl('#hCoins');leave(c,false)}
function cleanTable(ti){const t=D.tables[ti];if(!t.dirty)return;t.dirty=false;if(t.claim)t.claim=null;const p=L.tables[ti];burst(p.x,p.y,12,['#FFFFFF','#BDEBFF','#F3D88A']);sfx.clean()}
function leave(c,angry){if(c.st==='leave')return;
  if(c.table>=0){const t=D.tables[c.table];if(t.cust===c)t.cust=null}
  const qi=D.queue.indexOf(c);if(qi>=0)D.queue.splice(qi,1);
  if(c.tk)removeTicket(c.tk);if(D.sel===c)D.sel=null;
  if(SEATED.includes(c.st)&&c.table>=0){const p=seatPos(c.table);c.x=p.x;c.y=p.y+L.hr*1.6}
  c.st='leave';c.angry=angry;c.hint=null;c.claim=null;c.spd=CFG.walk*1.3;
  if(angry){D.stats.bad++;if(c.critic)D.stats.criticAngry=true;sfx.angry();buzz(40);float(c.x,c.y-L.hr*4,'😠','#fff',true);if(!D.ended&&D.stats.bad%CFG.badReviewsLimit===0)toast(T('angryLeft')+' 👎×'+D.stats.bad);updHud();popEl('#hBad')}}

/* ---------------- helpers (staff) ---------------- */
function claimFree(o,h){return!o.claim||o.claim===h}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function findTask(h){
  if(h.kind==='host'){const c=D.queue.find(q=>q.st==='queue'&&!q.claim);if(!c)return;let best=-1,bd=1e9;D.tables.forEach((t,i)=>{if(!t.cust&&!t.dirty&&!t.claim){const d=dist(L.tables[i],L.door);if(d<bd){bd=d;best=i}}});if(best<0)return;
    c.claim=h;D.tables[best].claim=h;h.task={type:'seat',c,ti:best};h.phase=0;return}
  if(h.kind==='cleaner'){let best=-1,bd=1e9;D.tables.forEach((t,i)=>{if(t.dirty&&!t.cust&&!t.claim){const d=dist(L.tables[i],h);if(d<bd){bd=d;best=i}}});if(best<0)return;D.tables[best].claim=h;h.task={type:'clean',ti:best};h.phase=0;return}
  if(h.kind==='waiter'){let best=null,bd=1e9;const u=L.u;
    D.customers.forEach(c=>{if((c.st==='order'||c.st==='bill')&&!c.claim){const d=dist(serveSpot(c.table),h)-(c.st==='bill'?u*.5:0);if(d<bd){bd=d;best={type:c.st,c}}}});
    D.tickets.forEach(tk=>{if(tk.st==='ready'&&!tk.claim&&!tk.carried&&tk.c.st==='food'){const d=dist(platePos(tk)||h,h)-u*.8;if(d<bd){bd=d;best={type:'serve',tk}}}});
    if(!best)return;if(best.c)best.c.claim=h;else best.tk.claim=h;h.task=best;h.phase=0}}
function taskValid(h){const k=h.task;switch(k.type){
  case 'seat':return h.phase===1||(k.c.st==='queue'&&!D.tables[k.ti].cust&&!D.tables[k.ti].dirty);
  case 'clean':return D.tables[k.ti].dirty&&!D.tables[k.ti].cust;
  case 'order':return k.c.st==='order';case 'bill':return k.c.st==='bill';
  case 'serve':return D.tickets.includes(k.tk)&&k.tk.st==='ready'&&k.tk.c.st==='food'&&(!k.tk.carried||k.tk.carried===h)}return false}
function dropTask(h){const k=h.task;if(!k)return;if(k.c&&k.c.claim===h)k.c.claim=null;if(k.ti!=null&&D.tables[k.ti].claim===h)D.tables[k.ti].claim=null;
  if(k.tk){if(k.tk.claim===h)k.tk.claim=null;if(k.tk.carried===h)k.tk.carried=null}h.carry=null;h.task=null;h.t=0;h.phase=0}
function taskTarget(h){const k=h.task;switch(k.type){
  case 'seat':if(h.phase===0)return{x:k.c.x+(L.wide?-L.hr*2.2:L.hr*2.2),y:k.c.y};return serveSpot(k.ti);
  case 'clean':return serveSpot(k.ti);
  case 'order':case 'bill':return serveSpot(k.c.table);
  case 'serve':if(h.phase===0){const p=platePos(k.tk);return p?{x:p.x,y:p.y+p.s*.6}:{x:h.x,y:h.y}}return serveSpot(k.tk.c.table)}}
function arriveTask(h){const k=h.task;switch(k.type){
  case 'seat':if(h.phase===0){if(seat(k.c,k.ti,h)){k.c.escort=h;h.phase=1}else dropTask(h)}else{k.c.escort=null;D.tables[k.ti].claim=null;h.task=null}break;
  case 'clean':h.t=CFG.cleanTime;break;
  case 'order':case 'bill':h.t=CFG.actionTime;break;
  case 'serve':if(h.phase===0){k.tk.carried=h;h.carry=DISH[k.tk.dish].emoji;h.phase=1}else{serveTicket(k.tk);h.carry=null;h.task=null}break}}
function finishAction(h){const k=h.task;if(!k)return;if(k.type==='clean'){D.tables[k.ti].claim=null;cleanTable(k.ti)}else if(k.type==='order')takeOrder(k.c);else if(k.type==='bill')collect(k.c);h.task=null}
function updHelper(h,dt){const sp=CFG.helperSpeed*L.u;
  if(h.kind==='chef'){const p=helperHome(h);h.moving=!moveTo(h,p.x,p.y,sp,dt);const st=D.stoves[h.stove];if(!st.tk&&!D.ended){const tk=D.tickets.find(k=>k.st==='pending'&&(D.stock[k.dish]||0)>0);if(tk)startCook(tk,h.stove)}h.busy=!!st.tk;return}
  if(h.task&&!taskValid(h))dropTask(h);
  if(!h.task&&!D.ended)findTask(h);
  if(!h.task){const p=helperHome(h);h.moving=!moveTo(h,p.x,p.y,sp*.8,dt);return}
  if(h.t>0){h.moving=false;h.t-=dt;if(h.t<=0)finishAction(h);return}
  const p=taskTarget(h);h.moving=true;if(moveTo(h,p.x,p.y,sp,dt)){h.moving=false;arriveTask(h)}}

/* ---------------- update ---------------- */
function updCust(c,dt){const u=L.u;
  if(c.st!=='leave'){c.blinkT-=dt;if(c.blinkT<-.12)c.blinkT=2+Math.random()*4}
  switch(c.st){
    case 'queue':{const i=Math.max(0,D.queue.indexOf(c)),p=L.spots[Math.min(i,L.spots.length-1)];moveTo(c,p.x,p.y,CFG.walk*u,dt);drain(c,dt);break}
    case 'walk':{const s=seatPos(c.table);let tx=s.x,ty=s.y+L.hr*2.3,sp=c.spd*u;
      if(c.escort&&c.escort.task&&c.escort.task.c===c){const h=c.escort;const dx=h.x-c.x,dy=h.y-c.y,d=Math.hypot(dx,dy);if(d>L.hr*2.4){tx=h.x;ty=h.y}else sp=0}
      if(moveTo(c,tx,ty,sp,dt)&&tx===s.x){c.x=s.x;c.y=s.y;arriveTable(c)}break}
    case 'menu':c.t-=dt;if(c.t<=0){c.st='order';resetPat(c,'order')}break;
    case 'order':case 'food':case 'bill':drain(c,dt);break;
    case 'eat':c.t-=dt;if(c.t<=0){c.st='bill';resetPat(c,'bill')}break;
    case 'leave':if(moveTo(c,L.out.x,L.out.y,c.spd*u,dt))c.gone=true;break}
  hints(c,dt)}
function drain(c,dt){if(D.ended)return;c.pat-=dt;if(c.pat<=0)leave(c,true)}
function hints(c,dt){if(c.st==='leave'||c.st==='walk'){c.hint=null;return}
  if(c.hint){c.hintT-=dt;if(c.hintT<=0)c.hint=null;return}
  c.hintNext-=dt;if(c.hintNext>0)return;
  if(c.critic){c.hint=c.st==='eat'?pick(['taste','taste','note']):pick(['note','note','look']);c.hintT=1.8;c.hintNext=2.5+Math.random()*3}
  else{if(Math.random()<.4){c.hint=pick(['look','phone','look']);c.hintT=1.5}c.hintNext=5+Math.random()*7}}
function updTickets(dt){for(const tk of D.tickets)if(tk.st==='cooking'){tk.t+=dt;if(tk.t>=CFG.cookTime){tk.st='ready';if(tk.stove>=0)D.stoves[tk.stove].tk=null;tk.stove=-1;sfx.bell()}}}
function update(dt){
  updFx(dt);if(!D)return;
  if(mode==='service'&&paused)return;
  if(D.ended){D.customers.forEach(c=>{if(c.st==='leave')updCust(c,dt)});D.customers=D.customers.filter(c=>!c.gone);D.helpers.forEach(h=>{const p=helperHome(h);h.moving=!moveTo(h,p.x,p.y,CFG.helperSpeed*L.u,dt)});
    D.endT+=dt;if(mode==='service'&&D.endT>1.5&&!D.summaryShown){D.summaryShown=true;showSummary()}return}
  if(mode!=='service')return;
  D.t+=dt;const rem=D.len-D.t;
  if(rem>CFG.lastArrival){D.next-=dt;if(D.next<=0){if(D.queue.length<CFG.maxQueue){spawn();D.next=arrivalGap()}else D.next=1}}
  else if(!D.lastOrders){D.lastOrders=true;toast(T('lastOrders'))}
  D.customers.forEach(c=>updCust(c,dt));D.customers=D.customers.filter(c=>!c.gone);
  updTickets(dt);D.helpers.forEach(h=>updHelper(h,dt));
  if(rem<=5&&rem>0&&Math.ceil(rem)!==D.tick){D.tick=Math.ceil(rem);sfx.tick()}
  D.hintT-=dt;if(D.hintT<=0){D.hintT=.3;updHint()}
  updHud();
  if(rem<=0)endService()}
function endService(){D.ended=true;D.endT=0;D.sel=null;
  D.customers.forEach(c=>{if(c.st==='leave')return;
    if(c.st==='eat'||c.st==='bill'){const d=DISH[c.dish];D.coins+=d.price;D.stats.revenue+=d.price;D.stats.served++;D.tables[c.table].dirty=true;D.tables[c.table].plate=null}
    else D.stats.unserved++;leave(c,false)});
  D.tickets.slice().forEach(removeTicket);D.helpers.forEach(h=>dropTask(h));
  sfx.end();$('#hint').hidden=true;updHud(true);float(W/2,H/2,T('closed'),'#F3D88A',false,true);
  if(GP.gameplayStop)GP.gameplayStop();keepAwake(false)}

/* ---------------- fx ---------------- */
let FX={floats:[],parts:[]};
function float(x,y,text,col,emo,big){FX.floats.push({x,y,text,col,emo,big,t:0,life:big?1.6:1.1})}
function burst(x,y,n,cols){if(RM)n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=Math.random()*TAU,sp=40+Math.random()*120;FX.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:1,col:pick(cols),r:2+Math.random()*3})}}
function updFx(dt){FX.floats.forEach(f=>{f.t+=dt;f.y-=(f.big?8:28)*dt});FX.floats=FX.floats.filter(f=>f.t<f.life);
  FX.parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=160*dt;p.life-=dt*1.4});FX.parts=FX.parts.filter(p=>p.life>0)}
function drawFx(c){FX.parts.forEach(p=>{c.globalAlpha=clamp(p.life,0,1);c.fillStyle=p.col;circ(c,p.x,p.y,p.r);c.fill()});c.globalAlpha=1;
  FX.floats.forEach(f=>{const a=clamp(1-(f.t/f.life-.6)/.4,0,1);c.globalAlpha=a;
    if(f.emo)drawEmo(c,f.text,f.x,f.y,L.br*1.3);
    else{const fs=f.big?Math.min(W*.12,64):Math.max(15,L.r*.42);c.font=(f.big?'900 ':'900 ')+fs+'px '+(f.big?'"Playfair Display",Georgia,serif':'Nunito,system-ui,sans-serif');c.textAlign='center';c.textBaseline='middle';
      c.lineWidth=f.big?6:4;c.strokeStyle='#0F3D2E';c.strokeText(f.text,f.x,f.y);c.fillStyle=f.col;c.fillText(f.text,f.x,f.y)}});c.globalAlpha=1}

/* ---------------- drawing ---------------- */
function platePos(tk){const ready=D.tickets.filter(k=>k.st==='ready'&&!k.carried);const i=ready.indexOf(tk);if(i<0)return null;const g=gridRects(L.pass,Math.max(ready.length,2),1,.08)[i];const s=Math.min(g.w,g.h);return{x:g.x+g.w/2,y:g.y+g.h/2,s,rect:g}}
function railRects(){const pend=D.tickets.filter(k=>k.st==='pending');const R={x:L.rail.x+4,y:L.rail.y+10,w:L.rail.w-8,h:L.rail.h-12};return{pend,rects:gridRects(R,Math.max(pend.length,3),.8,.07)}}
function bubble(c,x,y,icon,frac,act,dimmed,badge){const br=L.br;if(act&&!RM)y+=Math.sin(now*6+x)*2.2;
  c.fillStyle='rgba(0,0,0,.25)';circ(c,x+1.5,y+3,br);c.fill();
  c.fillStyle=dimmed?'#EDE6D6':'#FFFDF8';c.beginPath();c.moveTo(x-br*.55,y+br*.6);c.lineTo(x-br*.95,y+br*1.15);c.lineTo(x-br*.1,y+br*.85);c.closePath();c.fill();circ(c,x,y,br);c.fill();
  c.lineWidth=2;c.strokeStyle=act?'#D9A93B':'#C9BFA8';c.stroke();
  if(frac!=null){const rr2=br+4;c.lineWidth=5;c.strokeStyle='rgba(0,0,0,.28)';circ(c,x,y,rr2);c.stroke();c.strokeStyle=frac>.5?'#3DBE6B':frac>.25?'#F2B705':'#E5484D';c.beginPath();c.arc(x,y,rr2,-Math.PI/2,-Math.PI/2+TAU*clamp(frac,0,1));c.stroke()}
  drawEmo(c,icon,x,y,br*1.12);
  if(badge){c.fillStyle=badge.bg;circ(c,x+br*.72,y+br*.72,br*.42);c.fill();c.strokeStyle='#fff';c.lineWidth=1.5;c.stroke();if(badge.emo)drawEmo(c,badge.emo,x+br*.72,y+br*.72,br*.5);else{c.fillStyle='#fff';c.font='900 '+Math.round(br*.5)+'px Nunito,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(badge.text,x+br*.72,y+br*.74)}}}
function drawTableTop(c,i){const p=L.tables[i],t=D&&D.tables[i],r=L.r,x=p.x,y=p.y;
  c.fillStyle='rgba(0,0,0,.22)';circ(c,x+r*.05,y+r*.12,r*1.02);c.fill();
  c.fillStyle='#FFFFFF';circ(c,x,y,r);c.fill();c.lineWidth=S&&S.furniture?3:2;c.strokeStyle=S&&S.furniture?'#D9A93B':'#DCD4C2';c.stroke();
  c.strokeStyle='#F0E9DA';c.lineWidth=1;circ(c,x,y,r*.82);c.stroke();
  const px=x,py=y-r*.36,pr=r*.3;
  c.fillStyle='#FFFFFF';c.strokeStyle='#CFC6B4';c.lineWidth=1.2;circ(c,px,py,pr);c.fill();c.stroke();circ(c,px,py,pr*.68);c.stroke();
  c.strokeStyle='#A9A9A9';c.lineWidth=Math.max(1.2,r*.05);c.beginPath();c.moveTo(px-pr*1.4,py-pr*.6);c.lineTo(px-pr*1.4,py+pr*.7);c.moveTo(px+pr*1.4,py-pr*.6);c.lineTo(px+pr*1.4,py+pr*.7);c.stroke();
  c.fillStyle='rgba(200,230,255,.7)';c.strokeStyle='#A8C3D6';circ(c,x+r*.5,y-r*.6,r*.11);c.fill();c.stroke();
  if(S&&S.furniture){c.fillStyle='#D9A93B';circ(c,x-r*.38,y+r*.28,r*.12);c.fill();c.fillStyle='#FFFDF2';c.fillRect(x-r*.42,y+r*.08,r*.08,r*.2);c.fillStyle='#FFB52E';circ(c,x-r*.38,y+r*.05+(RM?0:Math.sin(now*9+i)*.6),r*.05);c.fill();
    c.fillStyle='#C8203C';circ(c,x+r*.36,y+r*.3,r*.1);c.fill();c.fillStyle='#2F7A45';c.beginPath();c.ellipse(x+r*.5,y+r*.36,r*.08,r*.04,.5,0,TAU);c.fill()}
  else{c.fillStyle='#E9E2D3';circ(c,x,y+r*.3,r*.1);c.fill();c.fillStyle='#E8577E';circ(c,x,y+r*.25,r*.06);c.fill()}
  if(t&&t.plate)drawEmo(c,DISH[t.plate].emoji,px,py,r*.52);
  if(t&&t.dirty){c.fillStyle='rgba(140,90,40,.55)';c.beginPath();c.ellipse(px+pr*.2,py,pr*.45,pr*.3,.4,0,TAU);c.fill();
    for(let k=0;k<9;k++){const h=hash(t.seed,k);c.fillStyle=k%3?'rgba(150,100,50,.75)':'rgba(120,60,40,.55)';circ(c,x+((h%100)/100-.5)*r*1.3,y+(((h>>8)%100)/100-.4)*r*1.1,1.2+(h>>16)%3*.7);c.fill()}
    c.fillStyle='rgba(150,30,60,.25)';c.beginPath();c.ellipse(x+r*.38,y-r*.42,r*.18,r*.12,0,0,TAU);c.fill()}
  c.fillStyle='#0F3D2E';const nr=Math.max(7,r*.17);circ(c,x,y+r*.7,nr);c.fill();c.fillStyle='#F3D88A';c.font='900 '+Math.round(nr*1.2)+'px Nunito,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(String(i+1),x,y+r*.72)}
function custOpts(c){const seated=SEATED.includes(c.st);const o={mood:c.angry?0:(c.patMax?c.pat/c.patMax:1),angry:c.angry,blink:c.blinkT<0,eat:c.st==='eat'&&!RM&&Math.sin(now*5+c.id)>.3,walk:c.walk,hint:c.hint};
  if(c.hint==='look')o.look=Math.sin(now*3+c.id)*1.2;if(seated)o.walk=0;return o}
function draw(){const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.drawImage(bgc,0,0,W,H);
  const r=L.r,hr=L.hr;const want=D&&!D.ended&&mode==='service'&&D.queue.length>0;
  /* kitchen */
  if(D){const rail=railRects();rail.pend.forEach((tk,i)=>{const q=rail.rects[i];if(!q)return;const noStock=(D.stock[tk.dish]||0)<=0;c.save();c.translate(q.x+q.w/2,q.y);c.rotate((hash(tk.id,1)%7-3)*.02);
      c.fillStyle='#FFFEF8';c.strokeStyle=noStock?'#E5484D':'#C9BFA8';c.lineWidth=noStock?2.5:1.5;rr(c,-q.w/2,0,q.w,q.h,4);c.fill();c.stroke();c.fillStyle='#9AA3A0';c.fillRect(-q.w*.12,-3,q.w*.24,6);
      const fs=Math.max(9,Math.min(q.w,q.h)*.26);c.fillStyle='#0F3D2E';c.font='900 '+Math.round(fs)+'px Nunito,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(String(tk.c.seatNo),0,fs*.75);
      drawEmo(c,DISH[tk.dish].emoji,0,q.h*.62,Math.min(q.w,q.h)*.42);if(noStock){c.strokeStyle='#E5484D';c.lineWidth=3;c.beginPath();c.moveTo(-q.w*.3,q.h*.4);c.lineTo(q.w*.3,q.h*.85);c.moveTo(q.w*.3,q.h*.4);c.lineTo(-q.w*.3,q.h*.85);c.stroke()}
      else if(!RM){c.globalAlpha=.5+.5*Math.sin(now*5);c.strokeStyle='#D9A93B';c.lineWidth=2;rr(c,-q.w/2-2,-2,q.w+4,q.h+4,6);c.stroke();c.globalAlpha=1}c.restore()});
    D.stoves.forEach((st,i)=>{const s=L.stoves[i];if(!s||!st.tk)return;const cx=s.x+s.w/2,cy=s.y+s.h*.45,pr=Math.min(s.w,s.h)*.34;
      if(!RM)for(let k=0;k<6;k++){const a=k*TAU/6+now*3;c.fillStyle=k%2?'#FF9F1C':'#FFD23F';circ(c,cx+Math.cos(a)*pr*1.05,cy+Math.sin(a)*pr*1.05,pr*.16+Math.sin(now*20+k)*pr*.04);c.fill()}
      c.fillStyle='#3B3F3E';circ(c,cx,cy,pr);c.fill();c.fillStyle='#55605C';circ(c,cx,cy,pr*.82);c.fill();c.strokeStyle='#3B3F3E';c.lineWidth=pr*.22;c.beginPath();c.moveTo(cx+pr,cy);c.lineTo(cx+pr*1.6,cy+pr*.2);c.stroke();
      drawEmo(c,DISH[st.tk.dish].emoji,cx,cy+(RM?0:Math.sin(now*12)*1.2),pr*1.1);
      c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.3)';circ(c,cx,cy,pr*1.35);c.stroke();c.strokeStyle='#4FC3F7';c.beginPath();c.arc(cx,cy,pr*1.35,-Math.PI/2,-Math.PI/2+TAU*clamp(st.tk.t/CFG.cookTime,0,1));c.stroke()});
    D.tickets.forEach(tk=>{const p=platePos(tk);if(!p)return;const pr=p.s*.36;c.fillStyle='rgba(0,0,0,.18)';circ(c,p.x+1,p.y+2,pr);c.fill();c.fillStyle='#FFFFFF';c.strokeStyle='#D9A93B';c.lineWidth=2;circ(c,p.x,p.y,pr);c.fill();c.stroke();
      drawEmo(c,DISH[tk.dish].emoji,p.x,p.y,pr*1.15);const tr=Math.max(8,pr*.42);c.fillStyle='#7B1E34';circ(c,p.x+pr*.85,p.y-pr*.8,tr);c.fill();c.fillStyle='#FFF4DA';c.font='900 '+Math.round(tr*1.2)+'px Nunito,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(String(tk.c.seatNo),p.x+pr*.85,p.y-pr*.78);
      if(!RM){c.globalAlpha=.6+.4*Math.sin(now*8);drawEmo(c,'✨',p.x-pr*.9,p.y-pr*.9,pr*.6);c.globalAlpha=1}})}
  /* tables + seated customers */
  L.tables.forEach((p,i)=>{const t=D&&D.tables[i],cu=t&&t.cust;
    if(cu&&SEATED.includes(cu.st)){const s=seatPos(i);drawBust(c,cu.look,s.x,s.y,hr,custOpts(cu))}
    if(want&&t&&!t.cust){const ok=!t.dirty;c.save();c.globalAlpha=RM?.7:.45+.35*Math.sin(now*5);c.strokeStyle=ok?'#5CFF9A':(D.sel?'#FF5A5A':'rgba(0,0,0,0)');c.lineWidth=5;circ(c,p.x,p.y,r*1.18);c.stroke();c.restore()}
    drawTableTop(c,i)});
  /* walkers, helpers, queue, sorted by y */
  if(D){const list=[];D.customers.forEach(cu=>{if(!SEATED.includes(cu.st))list.push({y:cu.y,cu})});D.helpers.forEach(h=>list.push({y:h.y,h}));list.sort((a,b)=>a.y-b.y);
    list.forEach(o=>{if(o.cu){const cu=o.cu;const op=custOpts(cu);
        if(D.sel===cu){c.save();c.strokeStyle='#5CFF9A';c.lineWidth=4;c.beginPath();c.ellipse(cu.x,cu.y,hr*1.6,hr*.6,0,0,TAU);c.stroke();c.restore()}
        if(cu.st==='leave')c.globalAlpha=clamp(1-(dist(cu,L.out)<hr*4?1-dist(cu,L.out)/(hr*4):0),0,1);
        drawStanding(c,cu.look,cu.x,cu.y,hr,op);c.globalAlpha=1;
        if(cu.st==='queue'){const f=cu.pat/cu.patMax,bw=hr*2.2,by=cu.y-hr*5.6-(cu.look.hat===1?hr*.9:0);c.fillStyle='rgba(0,0,0,.45)';rr(c,cu.x-bw/2,by,bw,6,3);c.fill();c.fillStyle=f>.5?'#3DBE6B':f>.25?'#F2B705':'#E5484D';rr(c,cu.x-bw/2,by,bw*clamp(f,0,1),6,3);c.fill()}}
      else{const h=o.h;drawStanding(c,h.look,h.x,h.y,hr,{walk:h.moving?h.walk:0,mood:.8,carry:h.carry});
        if(h.t>0&&h.task&&h.task.type==='clean'&&!RM){drawEmo(c,'🧽',h.x-hr*1.2,h.y-hr*2.5+Math.sin(now*18)*2,hr*1.1)}
        if(h.kind==='chef'&&h.busy&&!RM){c.strokeStyle='#C9C3B6';c.lineWidth=2;c.beginPath();c.moveTo(h.x+hr*1.1,h.y-hr*2.4);c.lineTo(h.x+hr*1.6+Math.sin(now*10)*hr*.3,h.y-hr*3.6);c.stroke()}}})}
  /* bubbles */
  if(D&&!D.ended){L.tables.forEach((p,i)=>{const t=D.tables[i],cu=t.cust;const bx=p.x+r*.95+L.br*.3,by=p.y-r*.86-hr*2.6;
    if(cu&&SEATED.includes(cu.st)){const f=cu.pat/cu.patMax;
      if(cu.st==='menu')bubble(c,bx,by,'📖',null,false,true);
      else if(cu.st==='order')bubble(c,bx,by,'📝',f,true);
      else if(cu.st==='food'){const tk=cu.tk;if(!tk)return;
        if(tk.st==='pending'){if((D.stock[tk.dish]||0)<=0)bubble(c,bx,by,DISH[tk.dish].emoji,f,false,true,{bg:'#E5484D',text:'0'});else bubble(c,bx,by,'🍳',f,true,false,{bg:'#FFFFFF',emo:DISH[tk.dish].emoji})}
        else if(tk.st==='cooking'){bubble(c,bx,by,DISH[tk.dish].emoji,f,false,true);const bw=L.br*1.6;c.fillStyle='rgba(0,0,0,.4)';rr(c,bx-bw/2,by+L.br+7,bw,5,2.5);c.fill();c.fillStyle='#4FC3F7';rr(c,bx-bw/2,by+L.br+7,bw*clamp(tk.t/CFG.cookTime,0,1),5,2.5);c.fill()}
        else bubble(c,bx,by,'🛎️',f,true)}
      else if(cu.st==='bill')bubble(c,bx,by,'💰',f,true)}
    else if(t.dirty&&!cu)bubble(c,p.x+r*.7,p.y-r*1.2,'🧽',null,true)})}
  drawFx(c)}

/* ---------------- input ---------------- */
function inRect(x,y,q,m){m=m||0;return x>=q.x-m&&x<=q.x+q.w+m&&y>=q.y-m&&y<=q.y+q.h+m}
function onTap(x,y){if(!D||mode!=='service'||paused||D.ended)return;
  const rail=railRects();for(let i=0;i<rail.pend.length;i++){const q=rail.rects[i];if(q&&inRect(x,y,q,4)){playerCook(rail.pend[i]);return}}
  for(const tk of D.tickets){const p=platePos(tk);if(p&&inRect(x,y,p.rect,2)){if(tk.c.st==='food'){serveTicket(tk)}return}}
  const hr=L.hr;let qc=null,qd=1e9;D.queue.forEach(cu=>{const d=Math.hypot(x-cu.x,(y-(cu.y-hr*2.4))*.7);if(d<hr*2.6&&d<qd){qd=d;qc=cu}});
  if(qc){D.sel=D.sel===qc?null:qc;sfx.tap();return}
  for(let i=0;i<L.tables.length;i++){const p=L.tables[i];const cell=p.cell;if(inRect(x,y,cell)||Math.hypot(x-p.x,y-p.y)<L.r*1.3){tapTable(i);return}}
  D.sel=null}
function tapTable(i){const t=D.tables[i],c=t.cust;
  if(!c){if(D.sel){seat(D.sel,i);D.sel=null;return}if(t.dirty){cleanTable(i);return}if(D.queue.length){seat(D.queue[0],i);return}return}
  switch(c.st){case 'order':takeOrder(c);break;
    case 'food':{const tk=c.tk;if(!tk)break;if(tk.st==='pending')playerCook(tk);else if(tk.st==='ready')serveTicket(tk);break}
    case 'bill':collect(c);break}}
cv.addEventListener('pointerdown',e=>{const b=cv.getBoundingClientRect();onTap(e.clientX-b.left,e.clientY-b.top)});

/* ---------------- HUD + hints ---------------- */
let hudCache={};
function updHud(force){if(!D)return;const rem=Math.max(0,D.len-D.t),sec=Math.ceil(rem);
  const set=(k,v,el)=>{if(force||hudCache[k]!==v){hudCache[k]=v;el()}};
  set('t',sec,()=>{$('#hTime').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');$('#hTimer').classList.toggle('low',sec<=10)});
  $('#hBar').style.transform='scaleX('+clamp(rem/D.len,0,1).toFixed(4)+')';
  set('c',D.coins,()=>{$('#hCoinN').textContent=D.coins});
  set('b',D.stats.bad,()=>{$('#hBadN').textContent=D.stats.bad+'/'+CFG.badReviewsLimit;$('#hBad').setAttribute('aria-label',T('bad_al')+': '+D.stats.bad)});
  set('s',S.stars,()=>{$('#hStars').innerHTML=stars5(S.stars);$('#hStarsN').textContent='★'+S.stars;$('#hStarsBox').setAttribute('aria-label',T('stars')+': '+S.stars)});
  set('d',S.day,()=>{$('#hDay').textContent=T('day',{n:S.day})})}
function popEl(s){const e=$(s);if(!e||RM)return;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
function updHint(){const el=$('#hint');if(!D||D.ended||S.day>2){el.hidden=true;return}
  let k=null,e='';const cs=D.customers;
  if(D.tickets.some(tk=>tk.st==='ready'&&tk.c.st==='food')){k='hServe';e='🛎️'}
  else if(cs.some(c=>c.st==='bill')){k='hPay';e='💰'}
  else if(cs.some(c=>c.st==='order')){k='hOrder';e='📝'}
  else if(D.tickets.some(tk=>tk.st==='pending'&&(D.stock[tk.dish]||0)>0)&&D.stoves.some(s=>!s.tk)){k='hCook';e='🍳'}
  else if(D.tickets.some(tk=>tk.st==='pending'&&(D.stock[tk.dish]||0)<=0)){k='hNoStock'}
  else if(D.queue.length&&D.tables.some(t=>!t.cust&&!t.dirty)){k=D.sel?'hSeatSel':'hSeat'}
  else if(D.tables.some(t=>t.dirty&&!t.cust)){k='hClean';e='🧽'}
  else if(!D.customers.length){k='hWait'}
  if(!k){el.hidden=true;return}el.style.left=(L.D.x+L.D.w/2)+'px';el.style.top=(L.D.y+8)+'px';el.style.maxWidth=Math.max(200,L.D.w-24)+'px';const html=esc(T(k,{e:'\u0000'})).replace('\u0000','<span class="emo">'+e+'</span>');if(el.dataset.k!==html){el.dataset.k=html;el.innerHTML=html}el.hidden=false}

let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2200)}

  $('#homeLang').innerHTML=langButtons();

function confirmNew(){openOv(()=>{$('#ovCard').innerHTML='<h2>'+esc(T('newGame'))+'</h2><div class="confirm"><p class="lead">'+esc(T('newGameQ'))+'</p><div class="row"><button class="btn primary" data-act="reset" type="button">'+esc(T('yesRestart'))+'</button><button class="btn" data-act="close" data-focus type="button">'+esc(T('no'))+'</button></div></div>'})}
function legendHtml(){return'<ul class="legend">'+[['🚪','lgSeat'],['📝','lgOrder'],['🍳','lgCook'],['🛎️','lgServe'],['💰','lgPay'],['🧽','lgClean'],['⏳','lgPatience']].map(([e,k])=>'<li><span class="emo">'+e+'</span><span>'+esc(T(k))+'</span></li>').join('')+'</ul>'}

function resumeGame(){if(!paused)return;closeOv();paused=false;last=performance.now();if(GP.gameplayStart)GP.gameplayStart()}
function sumRow(label,val,cls){return'<div class="'+(cls||'')+'"><span>'+esc(label)+'</span><b>'+val+'</b></div>'}
function showSummary(){mode='summary';const st=D.stats,pen=Math.floor(st.bad/CFG.badReviewsLimit)*CFG.badReviewPenalty,wg=wagesTotal(),end=Math.max(0,D.coins-pen-wg);
  openOv(()=>{$('#ovCard').innerHTML='<h2>'+esc(T('dayOver'))+'</h2><p class="sub">'+esc(T('day',{n:S.day}))+' · '+esc(S.name)+'</p><div class="sum">'+
    sumRow(T('served'),st.served)+(st.unserved?sumRow(T('unserved'),st.unserved):'')+sumRow(T('earned'),'+'+st.revenue+' '+COIN,'pos')+sumRow(T('tips'),'+'+st.tips+' '+COIN,'pos')+
    sumRow(T('bad'),'👎 '+st.bad,st.bad?'neg':'')+(pen?sumRow(T('badPenalty'),'−'+pen+' '+COIN,'neg'):'')+(wg?sumRow(T('wages'),'−'+wg+' '+COIN,'neg'):'')+
    sumRow(T('dayTotal'),end+' '+COIN,'tot')+'</div><div class="row"><button class="btn primary big" data-act="guess" data-focus type="button">🕵️ '+esc(T('whoCritic'))+'</button></div>'})}
let guessDone=null;
function showGuess(){mode='guess';guessDone=null;if(!D.all.some(c=>c.critic)&&D.all.length)D.all[0].critic=true;renderGuess()}
function renderGuess(){openOv(()=>{const g=guessDone;let h='<h2>'+esc(T('guessTitle'))+'</h2>';
  if(!g)h+='<p class="sub">'+esc(T('guessSub'))+'</p>';
  else{h+='<div class="result '+(g.right?'good':'bad')+'">'+esc(T(g.right?'guessRight':'guessWrong'))+'<small>'+esc(g.right?T('prizeRight',{c:CFG.critic.rightCoins}):T('prizeWrong',{c:CFG.critic.wrongCoins}))+'</small>'+(g.angry?'<small>'+esc(T('criticAngry'))+'</small>':'')+'</div>'}
  h+='<div class="guess" id="guessGrid"></div>';
  if(g)h+='<div class="row"><button class="btn primary big" data-act="afterGuess" data-focus type="button">'+esc(T('cont'))+'</button></div>';
  $('#ovCard').innerHTML=h;const grid=$('#guessGrid');
  D.all.forEach(c=>{const b=document.createElement(g?'div':'button');if(!g)b.type='button';b.className='gc';
    if(g){if(c.critic){b.classList.add('critic');b.dataset.badge='🕵️ '+T('critic')}if(c.id===g.id)b.classList.add(g.right?'right':'wrong');else if(c.critic)b.classList.add('right')}
    b.appendChild(portrait(c.look,110,{bg:c.critic&&g?'#F3D88A':'#E9DFC8'}));
    const m=document.createElement('span');m.className='meta';m.innerHTML=(c.dish?'<span class="emo">'+DISH[c.dish].emoji+'</span>':'')+esc(c.seatNo?T('tableN',{n:c.seatNo}):T('noTable'))+(c.angry?' <span class="emo">😠</span>':'');b.appendChild(m);
    b.setAttribute('aria-label',(c.seatNo?T('tableN',{n:c.seatNo}):T('noTable'))+(c.dish?', '+dishName(c.dish):''));
    if(!g)b.addEventListener('click',()=>resolveGuess(c));grid.appendChild(b)})})}
function resolveGuess(c){if(guessDone)return;const right=!!c.critic,st=D.stats;
  const pen=Math.floor(st.bad/CFG.badReviewsLimit)*CFG.badReviewPenalty;let coins=Math.max(0,D.coins-pen-wagesTotal());let stars=S.stars;
  if(st.criticAngry)stars=Math.max(0,stars-1);
  if(right){stars=Math.min(CFG.starsToWin,stars+1);coins+=CFG.critic.rightCoins}else coins=Math.max(0,coins-CFG.critic.wrongCoins);
  const gained=stars>S.stars;S.coins=coins;S.stars=stars;S.stock=D.stock;S.day++;S.maxStars=Math.max(S.maxStars,stars);S.gifts=unlockDishes();
  const winNow=stars>=CFG.starsToWin&&!S.won;if(winNow)S.won=true;persist();
  guessDone={id:c.id,right,angry:st.criticAngry,win:winNow};
  if(right){sfx.star();if(gained&&GP.happy)GP.happy()}else sfx.wrong();
  renderGuess()}
function showWin(){mode='win';sfx.win();if(GP.happy)GP.happy();
  openOv(()=>{document.querySelectorAll('#ov .confetti').forEach(x=>x.remove());let conf='<div class="confetti" aria-hidden="true">';for(let i=0;i<40;i++)conf+='<i style="left:'+rand(100)+'%;background:'+pick(['#F3C54A','#A02C48','#2E9457','#FFFFFF','#4F7BD8'])+';animation-duration:'+(2.5+Math.random()*3).toFixed(2)+'s;animation-delay:-'+(Math.random()*4).toFixed(2)+'s"></i>';conf+='</div>';
    $('#ovCard').innerHTML='<div class="win stack" style="align-items:center;text-align:center;position:relative"><div class="tstars">'+stars5(5)+'</div><h2>'+esc(T('winTitle'))+'</h2><p class="lead">'+esc(T('winText',{name:S.name}))+'</p><button class="btn primary big" data-act="shop" data-focus type="button">'+esc(T('freeMode'))+'</button></div>';
    $('#ov').insertAdjacentHTML('afterbegin',conf)})}

/* ---------------- shop ---------------- */
function costBtn(act,label,cost,dis){return'<button class="btn small'+(act.startsWith('fire')?'':' gold')+'" type="button" data-act="'+act+'"'+(dis?' disabled':'')+'>'+esc(label)+(cost!=null?' '+COIN+cost:'')+'</button>'}
function showShop(){mode='shop';D=null;paused=false;closeOv();showScreen('shop');renderShop();
  if(S.gifts&&S.gifts.length){const g=S.gifts;S.gifts=[];persist();setTimeout(()=>toast(T('gift',{n:CFG.newDishGift,dish:g.map(dishName).join(', ')})),300)}}
function renderShop(){const el=$('#shop'),ul=unlocked(),cap=capacity();let h='<div class="shop-in">';
  h+='<div class="shop-head"><h2>'+esc(S.name)+'</h2><div class="tools">'+langRow()+'<button class="icon-btn snd" data-act="sound" type="button"></button></div></div>';
  h+='<div class="shop-stats"><span class="pill">'+esc(T('day',{n:S.day}))+'</span><span class="pill">'+COIN+'<b>'+S.coins+'</b></span><span class="pill"><span class="hstars">'+stars5(S.stars)+'</span></span>'+(S.won?'<span class="pill">👑 '+esc(T('freeBadge'))+'</span>':'')+'</div>';
  if(ul.some(d=>!(S.stock[d.id]>0)))h+='<div class="warn">'+esc(T('zeroStock'))+'</div>';
  h+='<div class="shop-grid">';
  h+='<section class="sec"><h3>🧺 '+esc(T('ingredients'))+'</h3><p class="note">'+esc(T('ingHint'))+' '+esc(T('expected',{n:expectedCustomers()}))+'</p>';
  ul.forEach(d=>{const n=S.stock[d.id]||0;h+='<div class="item'+(S.gifts&&S.gifts.includes(d.id)?' new':'')+'"><div class="ic emo">'+d.emoji+'</div><div class="tx"><span class="nm">'+esc(dishName(d.id))+'</span><span class="ds">'+esc(T('each',{c:d.cost,p:d.price}))+'</span><span class="qty'+(n?'':' zero')+'">'+esc(n===1?T('portionOne'):T('portions',{n}))+'</span></div>'+
    '<div class="acts">'+costBtn('ing:'+d.id+':1','+1',d.cost,S.coins<d.cost)+costBtn('ing:'+d.id+':5','+5',d.cost*5,S.coins<d.cost*5)+'</div></div>'});
  h+='</section>';
  h+='<section class="sec"><h3>🤵 '+esc(T('staff'))+'</h3><p class="note">'+esc(T('staffHint'))+'</p>';
  HELPER_KINDS.forEach(k=>{const n=S.helpers[k],cf=CFG.helpers[k],full=n>=cf.max,cost=helperCost(k);
    h+='<div class="item"><div class="ic" data-staff="'+k+'"></div><div class="tx"><span class="nm">'+esc(T('h_'+k))+'</span><span class="ds">'+esc(T('hd_'+k))+' · '+esc(T('wage',{c:cf.wage}))+'</span><span class="qty">'+esc(T('owned',{n}))+'</span></div><div class="acts">'+
      (n?costBtn('fire:'+k,T('fire'),null,false):'')+(full?'<button class="btn small" type="button" disabled>'+esc(T('full'))+'</button>':costBtn('hire:'+k,T('hire'),cost,S.coins<cost))+'</div></div>'});
  h+='</section>';
  h+='<section class="sec"><h3>🏛️ '+esc(T('venue'))+'</h3>';
  UPGRADES.forEach(u=>{let desc,btn,ic;
    if(u==='table'){ic='🍽️';desc=T('ud_table',{n:S.tables,max:CFG.rooms.base+CFG.rooms.room+CFG.rooms.terrace});const c=tableCost();btn=S.tables>=cap?'<button class="btn small" type="button" disabled>'+esc(S.tables>=CFG.rooms.base+CFG.rooms.room+CFG.rooms.terrace?T('full'):T('needRoom'))+'</button>':costBtn('up:table','+1',c,S.coins<c)}
    else{ic={furniture:'🛋️',chandelier:'💎',room:'🚪',terrace:'🌅'}[u];desc=T('ud_'+u);const c=CFG.upgrades[u];btn=S[u]?'<button class="btn small" type="button" disabled>✓ '+esc(T('have'))+'</button>':costBtn('up:'+u,'',c,S.coins<c||(u==='terrace'&&!S.room))}
    h+='<div class="item"><div class="ic emo">'+ic+'</div><div class="tx"><span class="nm">'+esc(T('u_'+u))+'</span><span class="ds">'+esc(desc)+'</span></div><div class="acts">'+btn+'</div></div>'});
  h+='</section>';
  h+='<section class="sec"><h3>📜 '+esc(T('menu'))+'</h3><p class="note">'+esc(T('menuHint'))+'</p>';
  CFG.dishes.forEach(d=>{const on=d.stars<=S.maxStars;h+='<div class="item'+(on?'':' lock')+'"><div class="ic emo">'+(on?d.emoji:'🔒')+'</div><div class="tx"><span class="nm">'+esc(dishName(d.id))+'</span><span class="ds">'+COIN+' '+d.price+'</span></div><span class="tag">'+esc(on?T('inMenu'):T('needStars',{n:d.stars}))+'</span></div>'});
  h+='</section></div></div>';
  el.innerHTML=h;el.querySelectorAll('[data-staff]').forEach(x=>{const k=x.dataset.staff;x.appendChild(portrait(staffLook(k,0),48,{bg:'#F4EBD6'}))});
  $('#startBtn').textContent=T('startDay',{n:S.day});soundIcon()}
function buy(act){const [kind,a,b]=act.split(':');let cost=0;
  if(kind==='ing'){cost=DISH[a].cost*Number(b)}else if(kind==='hire'){cost=helperCost(a);if(S.helpers[a]>=CFG.helpers[a].max)return}
  else if(kind==='up'){if(a==='table'){if(S.tables>=capacity())return;cost=tableCost()}else{if(S[a])return;if(a==='terrace'&&!S.room)return;cost=CFG.upgrades[a]}}
  if(S.coins<cost){toast(T('noMoney'));sfx.no();return}
  S.coins-=cost;if(kind==='ing')S.stock[a]=(S.stock[a]||0)+Number(b);else if(kind==='hire')S.helpers[a]++;else if(a==='table')S.tables++;else S[a]=true;
  persist();sfx.coin();const y=$('#shop').scrollTop;renderShop();$('#shop').scrollTop=y}
function fire(k){openOv(()=>{$('#ovCard').innerHTML='<div class="confirm"><p class="lead">'+esc(T('fireQ'))+'</p><div class="row"><button class="btn primary" data-act="doFire:'+k+'" type="button">'+esc(T('yes'))+'</button><button class="btn" data-act="close" data-focus type="button">'+esc(T('no'))+'</button></div></div>'})}
let starting=false;
async function startNext(){if(starting)return;starting=true;$('#startBtn').disabled=true;sfx.tap();
  try{if(S.day>1)await adBreak()}finally{starting=false;$('#startBtn').disabled=false}showIntro()}
/* WHY: ads only at the natural break before a new day; audio promises are never awaited (iOS would hang). */
async function adBreak(){if(!GP.breakAd)return;if(GP.gameplayStop)GP.gameplayStop();adPlaying=true;if(actx)quiet(actx.suspend());try{await GP.breakAd()}catch(e){console.warn('Ad break failed',e)}adPlaying=false;if(actx&&soundOn)quiet(actx.resume())}

/* ---------------- language ---------------- */
function applyLang(){document.documentElement.lang=lang;document.title=T('title');
  document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=T(e.dataset.i)});
  document.querySelectorAll('[data-al]').forEach(e=>{e.setAttribute('aria-label',T(e.dataset.al==='bad'?'bad_al':e.dataset.al))});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===lang)));
  $('#hCoins').setAttribute('aria-label',T('coins'));$('#hTimer').setAttribute('aria-label',T('time'));soundIcon()}
function setLang(l){if(!LANGS.includes(l)||l===lang)return;lang=l;LS.set(LANG_KEY,l);sfx.tap();applyLang();
  if(mode==='home')renderHome();if(!$('#shop').hidden){const y=$('#shop').scrollTop;renderShop();$('#shop').scrollTop=y}if(ovRender&&!$('#ov').hidden)ovRender();hudCache={};if(D)updHud(true);if(S)renderBg()}

/* ---------------- events ---------------- */
document.addEventListener('click',e=>{const lb=e.target.closest('[data-lang]');if(lb){setLang(lb.dataset.lang);return}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='close'){sfx.tap();closeOv()}
  else if(a==='reset'){LS.del(SAVE_KEY);S=null;closeOv();sfx.tap();renderHome()}
  else if(a==='go'){startDay()}
  else if(a==='resume'){sfx.tap();resumeGame()}
  else if(a==='sound')toggleSound();
  else if(a==='quit'){closeOv();if(GP.gameplayStop)GP.gameplayStop();keepAwake(false);renderHome()}
  else if(a==='guess'){sfx.tap();showGuess()}
  else if(a==='afterGuess'){sfx.tap();if(guessDone&&guessDone.win)showWin();else showShop()}
  else if(a==='shop')showShop();
  else if(a.startsWith('ing:')||a.startsWith('hire:')||a.startsWith('up:'))buy(a);
  else if(a.startsWith('fire:'))fire(a.slice(5));
  else if(a.startsWith('doFire:')){const k=a.slice(7);if(S.helpers[k]>0)S.helpers[k]--;persist();sfx.tap();closeOv();renderShop()}});
$('#openBtn').addEventListener('click',newGame);
$('#nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')newGame()});
$('#contBtn').addEventListener('click',()=>{sfx.tap();if(S.day===1)showIntro();else showShop()});
$('#newBtn').addEventListener('click',()=>{sfx.tap();confirmNew()});
$('#soundBtn').classList.add('snd');$('#soundBtn').addEventListener('click',toggleSound);
$('#pauseBtn').addEventListener('click',()=>{sfx.tap();pauseGame()});
$('#startBtn').addEventListener('click',startNext);
$('#shopHome').addEventListener('click',()=>{sfx.tap();renderHome()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(mode==='service'&&!paused)pauseGame();else if(paused)resumeGame()}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')pauseGame();else if(mode==='service'&&!paused)keepAwake(true)});
window.addEventListener('resize',()=>{const ow=W,oh=H;layout();rescale(ow,oh)});
window.addEventListener('orientationchange',()=>setTimeout(()=>{const ow=W,oh=H;layout();rescale(ow,oh)},300));
function rescale(ow,oh){if(!D||(ow===W&&oh===H))return;const fx=W/ow,fy=H/oh;D.customers.forEach(c=>{if(SEATED.includes(c.st)&&c.table>=0){const s=seatPos(c.table);c.x=s.x;c.y=s.y}else{c.x*=fx;c.y*=fy}});D.helpers.forEach(h=>{h.x*=fx;h.y*=fy})}

/* ---------------- loop ---------------- */
let last=performance.now();
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;now+=dt;try{update(dt);draw()}catch(e){console.error(e)}requestAnimationFrame(frame)}

/* ---------------- boot ---------------- */
function boot(){$('#hCoinIc').innerHTML=COIN;if(!LS.get(LANG_KEY,null))lang=detectLang();if(!LINKS)$('#app').classList.add('nolinks');S=loadSave();renderHome();layout();requestAnimationFrame(frame);if(GP.loadingDone)GP.loadingDone()}
Promise.resolve().then(()=>GP.init&&GP.init()).catch(e=>console.warn('Platform init failed, playing without it',e)).then(boot);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(L.zones)renderBg()});
})();
</script>

</html>
