<style>
/* Layout: one-screen game. A live canvas runway fills the screen; HTML layers sit on top for menu, HUD, results, closet and dialogs.
   Single bright "atelier" look on purpose: lilac sky, coral carpet, measuring-tape yellow, ink outlines. */
:root{
  --sky:#ECE6FF;
  --sky2:#DCD1FF;
  --ink:#2B1B3D;
  --ink2:#5C4B72;
  --coral:#FF5C8A;
  --mint:#19B5A5;
  --violet:#8B5CF6;
  --sun:#FFD23F;
  --paper:#FFFFFF;
  --scrim:rgba(43,27,61,.58);
  --display:"Grandstander","Nunito",ui-rounded,"Comic Sans MS",system-ui,sans-serif;
  --body:"Nunito",ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
.nolinks .lnk{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;text-size-adjust:100%}
#app{position:relative;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
button{touch-action:manipulation}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* buttons */
.btn{font-family:var(--display);font-weight:800;font-size:1.05rem;line-height:1.1;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:.65em 1.2em;min-height:48px;box-shadow:0 4px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.45em;transition:transform .08s,box-shadow .08s,background .15s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.lang button:focus-visible,.icon-btn:focus-visible,.doll-card:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.btn.primary{background:var(--coral);color:#fff}
.btn.sun{background:var(--sun)}
.btn.big{font-size:1.45rem;padding:.7em 2.1em;min-height:62px}
.btn.small{font-size:.92rem;min-height:40px;padding:.45em .95em;box-shadow:0 3px 0 var(--ink)}
.btn[disabled]{opacity:.55;cursor:default}
.icon-btn{width:44px;height:44px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.icon-btn svg{width:22px;height:22px}
.badge{background:var(--sun);color:var(--ink);border:2px solid var(--ink);border-radius:999px;font-family:var(--body);font-weight:900;font-size:.85rem;min-width:1.8em;padding:0 .4em;line-height:1.5;font-variant-numeric:tabular-nums}

/* home */
.home{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;padding-block:12px 20px}
.home>*{pointer-events:auto}
.home-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.lang{display:flex;gap:6px;flex-wrap:wrap}
.lang button{font-family:var(--body);font-weight:900;font-size:.8rem;letter-spacing:.06em;border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:10px;padding:.3em .55em;min-height:36px;min-width:40px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.logo{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px;text-align:center}
.logo-a{font-family:var(--display);font-weight:900;font-size:clamp(2.1rem,9.5vw,3.8rem);line-height:.95;color:var(--ink);text-shadow:3px 3px 0 var(--coral);text-wrap:balance;max-width:14ch}
.logo-b{font-family:var(--display);font-weight:800;font-size:clamp(1.05rem,4.4vw,1.5rem);background-color:var(--sun);background-image:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 9px);background-size:100% 7px;background-repeat:no-repeat;background-position:0 100%;border:2.5px solid var(--ink);border-radius:6px;padding:.2em .9em .55em;transform:rotate(-2deg);letter-spacing:.02em}
.how{font-weight:800;color:var(--ink2);text-align:center;max-width:34ch;margin:8px auto 0;font-size:.98rem;text-wrap:balance}
.home-actions{display:flex;flex-direction:column;align-items:center;gap:12px}

/* HUD */
.hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding-block:10px;pointer-events:none}
.hud>*{pointer-events:auto}
.tape{flex:1;min-width:0;height:30px;border:2.5px solid var(--ink);border-radius:6px;background-color:var(--sun);background-image:repeating-linear-gradient(90deg,var(--ink) 0 1.5px,transparent 1.5px 8px),repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 40px);background-size:100% 6px,100% 11px;background-repeat:no-repeat;background-position:0 0,0 0;position:relative;overflow:hidden}
.tape-fill{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,92,138,.6);border-right:2.5px solid var(--coral)}
.tape-label{position:absolute;right:8px;bottom:2px;font-weight:900;font-size:.85rem;font-variant-numeric:tabular-nums}
.chip{display:flex;align-items:center;gap:6px;background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:.2em .7em .2em .35em;font-weight:900;font-variant-numeric:tabular-nums;min-height:36px;box-shadow:0 3px 0 var(--ink)}
.chip svg{width:22px;height:22px}

/* overlays */
.overlay{position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding-block:14px;z-index:20}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);width:min(760px,100%);max-height:100%;overflow:auto;padding:20px;user-select:text;-webkit-user-select:text}
.card h2,.card h3{font-family:var(--display);font-weight:900;margin:0;line-height:1.05;text-wrap:balance}
.card h2{font-size:clamp(1.6rem,6vw,2.2rem);text-align:center}
.card h3{font-size:1.5rem}
.card p{margin:0}
.res-grid{display:grid;grid-template-columns:1fr;gap:18px;margin-top:14px;align-items:center}
.res-grid>*{min-width:0}
@media (min-width:660px){.res-grid{grid-template-columns:1fr 1fr}}
.photo{margin:0;display:flex;flex-direction:column;align-items:center;gap:8px}
.polaroid{display:block;width:100%;max-width:320px;height:auto;border-radius:6px;box-shadow:0 6px 18px rgba(43,27,61,.28);transform:rotate(-2deg);-webkit-touch-callout:default;user-select:auto;-webkit-user-select:auto}
.photo figcaption{font-size:.85rem;font-weight:700;color:var(--ink2);text-align:center}
.res-side{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.judges{display:flex;justify-content:center;gap:16px}
.paddle{display:flex;flex-direction:column;align-items:center}
.pv{width:66px;height:66px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:1.55rem;font-variant-numeric:tabular-nums;transform:scale(0) rotate(-20deg);transition:transform .4s cubic-bezier(.3,1.7,.5,1)}
.paddle.show .pv{transform:scale(1) rotate(0)}
.stick{width:8px;height:22px;background:#C98B53;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 4px 4px;margin-top:-3px}
.pl{font-weight:900;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;margin-top:5px;color:var(--ink2)}
.total{display:flex;align-items:baseline;justify-content:center;gap:10px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;font-size:.85rem;color:var(--ink2)}
.total b{font-family:var(--display);font-size:2.4rem;color:var(--ink);letter-spacing:0;font-variant-numeric:tabular-nums}
.stars{display:flex;justify-content:center;gap:4px;min-height:34px}
.stars svg{width:32px;height:32px}
.field{font-family:var(--display);font-weight:800;font-size:1.2rem;border:2.5px solid var(--ink);border-radius:14px;padding:.55em .8em;width:100%;background:#fff;color:var(--ink);min-height:50px;box-sizing:border-box}
.field::placeholder{color:#9C8DB0}
.field:focus{outline:3px solid var(--violet);outline-offset:2px}
textarea.field{min-height:110px;font-family:var(--body);font-size:16px;resize:vertical}
.photo-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.stack{display:flex;flex-direction:column;gap:12px}
.err{color:#C0183F;font-weight:800}
.muted{color:var(--ink2);font-weight:700}
.copyrow{display:flex;gap:8px}
.copyrow input{flex:1;min-width:0;font-family:var(--body);font-size:16px;font-weight:700}
.lbl{font-weight:900;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.confirm{background:#FFF1F5;border:2.5px dashed var(--coral);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.detail{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.gift-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
.gift-strip figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:.9rem;min-width:0}
.gift-strip canvas{width:100%;height:auto;border-radius:12px;border:2px solid var(--ink)}
.gift-strip span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* closet */
.panel{position:absolute;inset:0;background:var(--sky);overflow:auto;z-index:15;user-select:text;-webkit-user-select:text}
.panel-inner{max-width:980px;margin:0 auto;padding-block:14px 40px;display:flex;flex-direction:column;gap:16px}
.panel-head{display:flex;align-items:center;gap:12px}
.panel-head h2{font-family:var(--display);font-weight:900;font-size:clamp(1.6rem,6vw,2.3rem);margin:0;line-height:1;flex:1;min-width:0}
.panel-head .badge{font-size:.95rem}
.rail{height:12px;border-radius:6px;background:linear-gradient(#FFF 0 30%,#C9B8FF 30%);border:2.5px solid var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:14px}
.doll-card{background:var(--paper);border:2.5px solid var(--ink);border-radius:18px;padding:8px 8px 10px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;min-width:0;position:relative}
.doll-card::before{content:"";position:absolute;top:-14px;left:50%;width:18px;height:14px;margin-left:-9px;border:2.5px solid var(--ink);border-bottom:0;border-radius:10px 10px 0 0}
.doll-card canvas{width:100%;height:auto;border-radius:12px;display:block}
.dc-name{font-family:var(--display);font-weight:800;font-size:1.1rem;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc-meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:800;font-size:.85rem;color:var(--ink2);font-variant-numeric:tabular-nums}
.dc-stars{color:#E0A400;letter-spacing:1px}
.empty{background:var(--paper);border:2.5px dashed var(--ink2);border-radius:18px;padding:28px 18px;text-align:center;font-weight:800;color:var(--ink2);max-width:46ch;margin:10px auto 0;text-wrap:balance}

.toast{position:absolute;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:800;padding:.7em 1.2em;border-radius:999px;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:0 6px 16px rgba(43,27,61,.3)}
@media (max-height:600px){
  .how{display:none}
  .logo{margin-top:0;gap:6px}
  .logo-a{font-size:clamp(1.6rem,6vw,2.4rem);max-width:none}
  .logo-b{font-size:1rem}
  .home{padding-block:8px 12px;justify-content:flex-start;gap:10px}
  .home-actions{flex-direction:row;justify-content:center;flex-wrap:wrap}
  .btn.big{font-size:1.2rem;min-height:52px;padding:.55em 1.6em}
  .card{padding:14px}
  .polaroid{max-width:220px}
}
@media (max-width:360px){.pv{width:58px;height:58px;font-size:1.35rem}.judges{gap:10px}.card{padding:14px}}
@media (prefers-reduced-motion:reduce){.pv{transition:none}.btn{transition:none}}

function hexA(h,a){const c=rgb(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'}
function lum(h){const c=rgb(h);return(.299*c[0]+.587*c[1]+.114*c[2])/255}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function starPath(c,x,y,r,n,inner){n=n||5;inner=inner||.48;c.beginPath();for(let i=0;i<n*2;i++){const a=-Math.PI/2+i*Math.PI/n,q=i%2?r*inner:r;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q)}c.closePath()}
function heartPath(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.9);c.bezierCurveTo(x-s*1.6,y-s*.2,x-s*.6,y-s*1.4,x,y-s*.5);c.bezierCurveTo(x+s*.6,y-s*1.4,x+s*1.6,y-s*.2,x,y+s*.9);c.closePath()}
function seeded(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function rid(){return Math.random().toString(36).slice(2,9)}

function pattern(c,pat,col){
  const pc=lum(col)>.7?shade(col,-.4):'rgba(255,255,255,.85)';
  c.fillStyle=pc;
  if(pat===1){for(let y=-140,r=0;y<4;y+=8,r++)for(let x=-56+(r%2)*4;x<56;x+=8){c.beginPath();c.arc(x,y,1.7,0,TAU);c.fill()}}
  else if(pat===2){for(let y=-140;y<4;y+=7)c.fillRect(-60,y,120,2.6)}
  else if(pat===3){for(let y=-140,r=0;y<4;y+=11,r++)for(let x=-56+(r%2)*5.5;x<56;x+=11){starPath(c,x,y,2.9);c.fill()}}
  else if(pat===4){for(let y=-140,r=0;y<4;y+=11,r++)for(let x=-56+(r%2)*5.5;x<56;x+=11){heartPath(c,x,y,2.3);c.fill()}}
  else if(pat===5){for(let y=-140,r=0;y<4;y+=12,r++)for(let x=-56+(r%2)*6;x<56;x+=12){c.fillStyle=pc;for(let k=0;k<5;k++){const a=k/5*TAU;c.beginPath();c.arc(x+Math.cos(a)*2.3,y+Math.sin(a)*2.3,1.5,0,TAU);c.fill()}c.fillStyle='#FFD23F';c.beginPath();c.arc(x,y,1.2,0,TAU);c.fill()}}
  else if(pat===6){const R=seeded(7);for(let i=0;i<80;i++){const x=-50+R()*100,y=-140+R()*140,s=.7+R()*1.3;c.fillStyle=i%3?pc:'#FFE27A';starPath(c,x,y,s*1.8,4,.35);c.fill()}}
}
function fab(c,p,col,pat){c.fillStyle=col;c.fill(p);if(pat){c.save();c.clip(p);pattern(c,pat,col);c.restore()}c.strokeStyle=shade(col,-.28);c.lineWidth=1.1;c.stroke(p)}

  for(const sd of[-1,1]){c.save();c.translate(sd*6,-112);c.rotate(sd*(.45+flap));
    c.fillStyle='rgba(255,255,255,.62)';c.strokeStyle=shade(oc,-.1);c.lineWidth=1.5;
    c.beginPath();c.ellipse(sd*19,-9,20,11,0,0,TAU);c.fill();c.stroke();
    c.beginPath();c.ellipse(sd*14,9,13,8,0,0,TAU);c.fill();c.stroke();c.restore()}
}

/* particles */
function burst(x,y,n,cols){if(RM)n=Math.ceil(n/3);for(let i=0;i<n;i++){const a=Math.random()*TAU,sp=60+Math.random()*220;G.parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:1,dec:1.1+Math.random()*.8,col:cols[rand(cols.length)],r:3+Math.random()*5,k:'star',rot:Math.random()*TAU})}}
function confetti(){G.parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*40,vy:80+Math.random()*90,life:1,dec:.22,col:COLORS[rand(11)],r:4+Math.random()*4,k:'conf',rot:Math.random()*TAU})}
function floatText(x,y,txt){G.texts.push({x,y,txt,life:1})}
function updateParts(dt){for(const p of G.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.k==='star'){p.vy+=260*dt;p.vx*=.98}p.rot+=dt*4;p.life-=p.dec*dt}G.parts=G.parts.filter(p=>p.life>0&&p.y<H+40);for(const t of G.texts){t.y-=50*dt;t.life-=dt*1.4}G.texts=G.texts.filter(t=>t.life>0)}
function drawParts(){for(const p of G.parts){ctx.save();ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.translate(p.x,p.y);ctx.rotate(p.rot);if(p.k==='star'){starPath(ctx,0,0,p.r,4,.4);ctx.fill()}else{ctx.fillRect(-p.r/2,-p.r,p.r,p.r*2)}ctx.restore()}
  ctx.font='900 18px Grandstander, Nunito, sans-serif';ctx.textAlign='center';for(const t of G.texts){ctx.globalAlpha=clamp(t.life,0,1);ctx.lineWidth=4;ctx.strokeStyle='#2B1B3D';ctx.strokeText(t.txt,t.x,t.y);ctx.fillStyle='#FFD23F';ctx.fillText(t.txt,t.x,t.y)}ctx.globalAlpha=1}

/* ---------------- track ---------------- */
const PX_CM=12;
function drawTrack(s,refY){
  ctx.fillStyle='#ECE6FF';ctx.fillRect(0,0,W,H);
  const side=trackX-tapeW;
  if(side>36){const tile=180,ofs=s*.6;const R0=Math.floor((ofs-H)/tile)-1,R1=Math.floor((ofs+H)/tile)+1;
    for(let k=R0;k<=R1;k++){const R=seeded(k*7919+13);for(const sd of[0,1]){const x=sd?trackX+trackW+tapeW+R()*(side-30)+15:R()*(side-30)+15;const y=refY-(k*tile-ofs)+R()*tile;const col=COLORS[Math.floor(R()*11)];ctx.globalAlpha=.4;drawButton(ctx,x,y,col,.9+R()*.8);ctx.globalAlpha=1}}}
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#FF9DBB');g.addColorStop(1,'#FF5C8A');ctx.fillStyle=g;ctx.fillRect(trackX,0,trackW,H);
  ctx.fillStyle='rgba(255,255,255,.07)';const off=s%40;for(let y=-40+off;y<H;y+=40)ctx.fillRect(trackX,y,trackW,14);
  ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2;ctx.setLineDash([9,7]);ctx.lineDashOffset=-s;
  ctx.beginPath();ctx.moveTo(trackX+9,0);ctx.lineTo(trackX+9,H);ctx.moveTo(trackX+trackW-9,0);ctx.lineTo(trackX+trackW-9,H);ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.moveTo(trackX+halfW,0);ctx.lineTo(trackX+halfW,H);ctx.stroke();ctx.setLineDash([]);
  for(const sd of[0,1]){const x=sd?trackX+trackW:trackX-tapeW;ctx.fillStyle='#FFD23F';ctx.fillRect(x,0,tapeW,H);ctx.fillStyle='#2B1B3D';ctx.fillRect(sd?x+tapeW-1.5:x,0,1.5,H);
    const k0=Math.ceil((s-(H-refY))/PX_CM),k1=Math.floor((s+refY)/PX_CM);ctx.font='800 9px Nunito, sans-serif';ctx.textAlign='center';
    for(let k=k0;k<=k1;k++){const y=refY-(k*PX_CM-s);const L=k%10===0?tapeW*.55:k%5===0?tapeW*.38:tapeW*.22;ctx.fillRect(sd?x:x+tapeW-L,y,L,1.2);if(k%10===0&&k>=0){ctx.save();ctx.translate(x+tapeW/2+(sd?3:-3),y-5);ctx.fillText(String(k/10|0),0,0);ctx.restore()}}}
}
function drawButton(c,x,y,col,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle=shade(col,-.3);c.beginPath();c.arc(0,1.6,11,0,TAU);c.fill();c.fillStyle=col;c.beginPath();c.arc(0,0,11,0,TAU);c.fill();c.strokeStyle=shade(col,-.32);c.lineWidth=1.5;c.beginPath();c.arc(0,0,7.5,0,TAU);c.stroke();c.fillStyle=shade(col,-.45);for(const p of[[-2.6,-2.6],[2.6,-2.6],[-2.6,2.6],[2.6,2.6]]){c.beginPath();c.arc(p[0],p[1],1.6,0,TAU);c.fill()}c.fillStyle='rgba(255,255,255,.55)';c.beginPath();c.arc(-4.2,-4.6,2.4,0,TAU);c.fill();c.restore()}

/* ---------------- gates ---------------- */
function swatch(cat,p){if(cat==='skin')return SKIN[p.skin];if(cat==='hairColor')return HAIR[p.hairColor];if(cat==='eyes')return EYES[p.eyes];if(cat==='outfitColor')return COLORS[p.outfitColor];if(cat==='shoes')return COLORS[p.shoeColor];if(cat==='makeup')return MAKEUP[p.makeup][0];return null}
function renderPreview(g,i){const w=panelW-10,h=panelH-10,cnv=document.createElement('canvas');cnv.width=Math.round(w*DPR);cnv.height=Math.round(h*DPR);const c=cnv.getContext('2d');c.scale(DPR,DPR);
  const d=Object.assign({},doll,g.opts[i]);const f=FOCUS[g.cat],s=h/f.sp;drawDoll(c,d,{x:w/2,y:h/2-f.cy*s,s,t:0,moving:0,noShadow:g.cat!=='shoes'&&g.cat!=='skin'});return cnv}
function drawGate(g,y){
  if(!g.prev[0]){g.prev=[renderPreview(g,0),renderPreview(g,1)]}
  const top=y-panelH,lab=T('c_'+g.cat),fs=clamp(trackW/24,13,18);
  ctx.save();ctx.globalAlpha=g.done?Math.max(0,1-(G.time-g.pt)*1.8):1;
  ctx.font='800 '+fs+'px Grandstander, Nunito, sans-serif';const tw=Math.min(ctx.measureText(lab).width,trackW-40);
  const bw=tw+30,bh=fs+16,bx=trackX+halfW-bw/2,by=top-bh-8;rr(ctx,bx,by,bw,bh,bh/2);ctx.fillStyle='#2B1B3D';ctx.fill();
  ctx.fillStyle='#FFFFFF';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(lab,trackX+halfW,by+bh/2+1,trackW-40);ctx.textBaseline='alphabetic';ctx.restore();
  for(let i=0;i<2;i++){const cx=trackX+halfW*(i+.5),x=cx-panelW/2;let a=1,sc=1;
    if(g.done){const dt=G.time-g.pt;if(i===g.pick){sc=1+Math.min(.15,dt*.6);a=Math.max(0,1-dt*1.5)}else a=Math.max(0,.35-dt*.8)}
    if(a<=0)continue;ctx.save();ctx.globalAlpha=a;ctx.translate(cx,y-panelH/2);ctx.scale(sc,sc);ctx.translate(-cx,-(y-panelH/2));
    const frame=i?'#8B5CF6':'#19B5A5';
    ctx.fillStyle='rgba(43,27,61,.25)';rr(ctx,x,top+5,panelW,panelH,18);ctx.fill();
    rr(ctx,x,top,panelW,panelH,18);ctx.fillStyle='#FFFFFF';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=frame;ctx.stroke();
    ctx.save();rr(ctx,x+5,top+5,panelW-10,panelH-10,14);ctx.clip();ctx.fillStyle=i?'#F1EAFF':'#E3F8F5';ctx.fillRect(x+5,top+5,panelW-10,panelH-10);ctx.drawImage(g.prev[i],x+5,top+5,panelW-10,panelH-10);ctx.restore();
    const sw=swatch(g.cat,g.opts[i]);if(sw){ctx.beginPath();ctx.arc(x+panelW-16,top+16,9,0,TAU);ctx.fillStyle=sw;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#2B1B3D';ctx.stroke()}
    ctx.restore()}
}

/* ---------------- run update & draw ---------------- */
function dollH(){return 195*dollS}
function updateRun(dt){const r=G.run;if(!r)return;
  if(G.keys.left)r.tx-=520*dt;if(G.keys.right)r.tx+=520*dt;
  r.tx=clamp(r.tx,trackX+28,trackX+trackW-28);r.x+=(r.tx-r.x)*Math.min(1,dt*12);
  if(G.mode==='count'){r.countT-=dt;const n=Math.ceil(r.countT-.6);if(n!==r.lastN){r.lastN=n;if(n>=1)sfx.tick();else sfx.go()}if(r.countT<=0)G.mode='run';return}
  r.s+=r.v*dt;r.hint-=dt;
  for(const g of r.gates){if(!g.done&&g.s<=r.s){const side=r.x<trackX+halfW?0:1;Object.assign(doll,g.opts[side]);g.done=true;g.pick=side;g.pt=G.time;r.passed++;r.flash=G.time;
    burst(trackX+halfW*(side+.5),dollY-panelH*.5,26,['#FFD23F','#FFFFFF','#FF5C8A','#19B5A5']);burst(r.x,dollY-dollH()*.6,18,['#FFFFFF','#FFD23F']);sfx.gate();buzz(25);updateHud()}}
  const bodyTop=dollY-dollH()*.9;
  for(const b of r.buttons){if(b.got){b.pop-=dt;continue}const y=dollY-(b.s-r.s),bx=trackX+trackW*b.f;if(y>bodyTop&&y<dollY+6&&Math.abs(bx-r.x)<34*Math.max(.8,dollS*1.2)){b.got=true;b.pop=.3;r.btn++;floatText(bx,y-14,'+10');burst(bx,y,6,[b.col,'#FFFFFF']);sfx.button();updateHud()}}
  const last=r.gates[r.gates.length-1].s;if(r.s>last+r.v*1.25)startWalk();
  if(r.s%1<1)updateHud();
}
function drawRun(){const r=G.run;drawTrack(r.s,dollY);
  for(const b of r.buttons){const y=dollY-(b.s-r.s);if(y<-20||y>H+20)continue;const bx=trackX+trackW*b.f;if(b.got){if(b.pop<=0)continue;ctx.globalAlpha=b.pop/.3;drawButton(ctx,bx,y,b.col,1+(.3-b.pop)*2);ctx.globalAlpha=1}else drawButton(ctx,bx,y,b.col,1+Math.sin(G.time*6+b.s)*.05)}
  for(const g of r.gates){const y=dollY-(g.s-r.s);if(y<-2||y>H+panelH+60)continue;drawGate(g,y)}
  const ft=G.time-r.flash;if(ft<.6){ctx.save();ctx.globalAlpha=(1-ft/.6)*.7;ctx.strokeStyle='#FFFFFF';ctx.lineWidth=6;ctx.beginPath();ctx.arc(r.x,dollY-dollH()*.5,dollH()*(.4+ft*.9),0,TAU);ctx.stroke();ctx.restore()}
  drawDoll(ctx,doll,{x:r.x,y:dollY,s:dollS,t:G.time,moving:G.mode==='run'?1:0});
  drawParts();
  if(G.mode==='count'){const n=Math.ceil(r.countT-.6);const txt=n>=1?String(n):T('go');const fr=(r.countT-.6)%1;const sc=1+(fr<0?0:fr)*.25;
    ctx.save();ctx.translate(W/2,H*.4);ctx.scale(sc,sc);ctx.font='900 '+Math.round(Math.min(W*.22,110))+'px Grandstander, Nunito, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=10;ctx.strokeStyle='#2B1B3D';ctx.strokeText(txt,0,0);ctx.fillStyle='#FFD23F';ctx.fillText(txt,0,0);ctx.restore();ctx.textBaseline='alphabetic'}
  if(G.mode==='count'||(r.hint>0&&G.mode==='run')){ctx.save();ctx.globalAlpha=G.mode==='run'?clamp(r.hint,0,1):1;const txt=T('drag');ctx.font='800 15px Nunito, sans-serif';const tw=ctx.measureText(txt).width;rr(ctx,W/2-tw/2-14,dollY+14,tw+28,30,15);ctx.fillStyle='rgba(43,27,61,.82)';ctx.fill();ctx.fillStyle='#FFFFFF';ctx.textAlign='center';ctx.fillText(txt,W/2,dollY+34);ctx.restore()}
}

/* ---------------- runway show ---------------- */
const STYLE_MATCH={0:[[2],[0,8]],1:[[0,2],[0,1]],2:[[3,5],[7,4]],3:[[1],[2,7]],4:[[4],[3,2,5]],5:[[0,4],[5,8]],6:[[0],[1,4]]};
function judge(d,ratio){const jit=()=>Math.random()*.6-.3;let st=6.8,co=6.8,cr=6.8;const m=STYLE_MATCH[d.style];
  if(m){if(m[0].includes(d.shoes))st+=1.1;if(m[1].includes(d.accessory))st+=1.1}
  if(d.shoeColor===d.outfitColor)co+=1.2;else if([11,12,13,14].includes(d.shoeColor))co+=.7;
  if(d.hairColor!=null&&d.outfitColor!=null&&Math.abs(lum(HAIR[d.hairColor])-lum(COLORS[d.outfitColor]))>.22)co+=.6;
  if(d.pattern>0)cr+=.9;if(d.hairColor>=6&&d.hairColor!==10)cr+=.8;if([1,3,5].includes(d.style))cr+=.4;if(d.makeup===4)cr+=.4;
  const b=ratio*1.6,f=v=>Math.round(clamp(v+b+jit(),6,10)*2)/2,s=[f(st),f(co),f(cr)],avg=(s[0]+s[1]+s[2])/3;return{s,stars:avg>=9.2?5:avg>=8.4?4:3}}
function startWalk(){const r=G.run;const j=judge(doll,r.buttons.length?r.btn/r.buttons.length:0);
  j.total=r.btn*10+r.passed*50+Math.round((j.s[0]+j.s[1]+j.s[2])*100);
  G.walk={t:0,fl:[],white:0,flashed:false,j};G.mode='walk';show('#hud',false);G.parts=[];sfx.cheer()}
function stageGeo(){const topY=H*.3,topW=Math.min(W*.22,150),botW=Math.min(W*.96,720);return{topY,topW,botW,hw:y=>topW/2+(botW/2-topW/2)*clamp((y-topY)/(H-topY),0,1)}}
function updateWalk(dt){const w=G.walk;if(!w)return;w.t+=dt;const S=stageGeo();
  const rate=G.mode==='walk'?7:2.2;if(Math.random()<dt*rate){const y=S.topY+Math.random()*(H-S.topY),sd=Math.random()<.5,room=W/2-S.hw(y)-10;if(room>8)w.fl.push({x:sd?Math.random()*room:W-Math.random()*room,y,life:1})}
  if(G.mode==='walk'){if(w.t>4.3&&!w.flashed){w.flashed=true;w.white=1;sfx.flash()}if(w.t>4.85)showResults()}
  else if(!RM&&Math.random()<dt*14)confetti();
  w.white=Math.max(0,w.white-dt*1.5);w.fl.forEach(f=>f.life-=dt*2.4);w.fl=w.fl.filter(f=>f.life>0)}
function drawStage(){const w=G.walk,S=stageGeo();
  ctx.fillStyle=lin(ctx,0,H,['#1C1030','#4A2D6B']);ctx.fillRect(0,0,W,H);
  for(let i=0;i<12;i++){ctx.fillStyle=i%2?'rgba(255,255,255,.035)':'rgba(0,0,0,.12)';ctx.fillRect(i*W/12,0,W/12,S.topY)}
  const bw=Math.min(W*.86,520),bh=Math.min(H*.1,64),bx=W/2-bw/2,by=H*.07;rr(ctx,bx,by,bw,bh,14);ctx.fillStyle='#3A2357';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#FFD23F';ctx.stroke();
  ctx.fillStyle='#FFD23F';ctx.font='900 '+Math.round(bh*.46)+'px Grandstander, Nunito, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(T('title'),W/2,by+bh/2+2,bw-24);ctx.textBaseline='alphabetic';
  for(let i=0;i<9;i++){ctx.fillStyle=Math.sin(G.time*6+i)>0?'#FFF3B0':'#B8962E';ctx.beginPath();ctx.arc(bx+18+i*(bw-36)/8,by+bh+8,3,0,TAU);ctx.fill()}
  ctx.fillStyle='rgba(255,245,210,.07)';for(const sx of[.12,.88]){ctx.beginPath();ctx.moveTo(W*sx-10,0);ctx.lineTo(W*sx+10,0);ctx.lineTo(W/2+S.botW*.22,H);ctx.lineTo(W/2-S.botW*.22,H);ctx.fill()}
  ctx.beginPath();ctx.moveTo(W/2-S.topW/2,S.topY);ctx.lineTo(W/2+S.topW/2,S.topY);ctx.lineTo(W/2+S.botW/2,H);ctx.lineTo(W/2-S.botW/2,H);ctx.closePath();ctx.fillStyle=lin(ctx,S.topY,H,['#C2406E','#FF5C8A']);ctx.fill();
  for(let i=0;i<=14;i++){const f=i/14,y=S.topY+(H-S.topY)*f*f,hw=S.hw(y),r=1.5+f*4;ctx.fillStyle=Math.sin(G.time*5+i*1.3)>-.2?'#FFE58A':'#A8862C';for(const sd of[-1,1]){ctx.beginPath();ctx.arc(W/2+sd*hw,y,r,0,TAU);ctx.fill()}}
  const heads=['#5B3F86','#6E4C9E','#4E3575','#7F5DB3'];
  for(let row=0;row<6;row++){const y=S.topY+30+row*(H-S.topY)/6,r=6+row*2.6,hw=S.hw(y);for(const sd of[-1,1]){let k=0;for(let x=W/2-sd*(hw+r*1.6);sd>0?x>-r:x<W+r;x-=sd*r*2.5){ctx.fillStyle=heads[(k+row)%4];ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.beginPath();ctx.ellipse(x,y+r*1.7,r*1.3,r*.9,0,Math.PI,TAU);ctx.fill();k++;if(k>40)break}}}
  for(const f of w.fl){ctx.save();ctx.globalAlpha=f.life;ctx.fillStyle='#FFFFFF';starPath(ctx,f.x,f.y,6+f.life*12,4,.25);ctx.fill();ctx.restore()}
  const p=1-Math.pow(1-Math.min(1,w.t/3.8),2.2),fy=S.topY+14+(H*.93-S.topY-14)*p,sF=H*.12/200,sN=Math.min(H*.6/200,W*.92/104),s=sF+(sN-sF)*p;
  drawDoll(ctx,doll,{x:W/2+Math.sin(w.t*6.5)*4*(1-p),y:fy,s,t:G.time,moving:w.t<3.8?.8:0});
  drawParts();
  if(G.mode==='walk'&&w.t<1.6){ctx.save();ctx.globalAlpha=clamp(1.6-w.t,0,1);ctx.font='900 '+Math.round(Math.min(W*.12,64))+'px Grandstander, Nunito, sans-serif';ctx.textAlign='center';ctx.lineWidth=8;ctx.strokeStyle='#2B1B3D';ctx.strokeText(T('runway'),W/2,H*.27);ctx.fillStyle='#FFD23F';ctx.fillText(T('runway'),W/2,H*.27);ctx.restore()}
  if(w.white>0){ctx.fillStyle='rgba(255,255,255,'+w.white+')';ctx.fillRect(0,0,W,H)}
}

/* ---------------- results ---------------- */
let lastSaved=null;
const nf=()=>new Intl.NumberFormat(lang,{maximumFractionDigits:1,minimumFractionDigits:0});
function showResults(){G.mode='result';if(GP.gameplayStop)GP.gameplayStop();if(G.walk.j.stars===5&&GP.happy)GP.happy();keepAwake(false);const j=G.walk.j;lastSaved=null;
  $('#photoImg').src=makePhoto(doll,'',j.stars);$('#photoImg').alt=T('title');
  show('#photoShareBtn',CAN_SHARE_PHOTO);show('#photoDlBtn',STANDALONE);
  for(let i=0;i<3;i++){const e=$('#j'+i);e.textContent=nf().format(j.s[i]);e.parentNode.classList.remove('show')}

  const sb=$('#saveBtn');sb.disabled=false;sb.textContent=T('save');show('#shareNewBtn',false);show('#result',true);
  [0,1,2].forEach(i=>setTimeout(()=>{$('#j'+i).parentNode.classList.add('show');beep(700+i*180,.15,'triangle',.05)},350+i*420));
  const t0=performance.now(),dur=1200;setTimeout(function tick(){const k=Math.min(1,(performance.now()-t0-1500)/dur);if(k<0){requestAnimationFrame(tick);return}$('#totalScore').textContent=Math.round(j.total*k).toLocaleString(lang);if(k<1)requestAnimationFrame(tick);else{$('#resStars').innerHTML=starsSVG(j.stars,32);sfx.cheer()}},0);

function saveDoll(){if(lastSaved)return;const list=getCloset();const name=($('#dollName').value||'').trim().slice(0,16)||T('defaultName',{n:list.length+1});
  const j=G.walk.j,rec={id:rid(),a:encodeAttrs(doll),n:name,p:j.total,st:j.stars,t:Date.now()};list.push(rec);
  if(!setCloset(list)){toast(T('saveFail'));list.pop();return}
  lastSaved=rec;$('#photoImg').src=makePhoto(doll,name,j.stars);const sb=$('#saveBtn');sb.disabled=true;sb.textContent=T('saved');show('#shareNewBtn',true);burst(W/2,H*.4,30,['#FFD23F','#FF5C8A','#19B5A5','#FFFFFF']);sfx.gate();updateCount()}

/* ---------------- closet ---------------- */
function getCloset(){const l=LS.get('pm-closet',[]);return Array.isArray(l)?l.filter(r=>r&&decodeAttrs(r.a)):[]}
function setCloset(l){return LS.set('pm-closet',l)}
function updateCount(){$('#closetCount').textContent=getCloset().length}
function starText(n){return'★'.repeat(n)+'☆'.repeat(5-n)}
function openCloset(){show('#closet',true);renderCloset();$('#closetBack').focus()}
function renderCloset(){const list=getCloset().sort((a,b)=>b.t-a.t),grid=$('#closetGrid');grid.textContent='';
  $('#closetN').textContent=list.length===1?T('dollsOne'):T('dollsN',{n:list.length});show('#closetEmpty',list.length===0);$('#shareClosetBtn').disabled=list.length===0;
  for(const rec of list){const d=decodeAttrs(rec.a);const b=document.createElement('button');b.type='button';b.className='doll-card';
    b.appendChild(dollCanvas(d,150,180));const n=document.createElement('div');n.className='dc-name';n.textContent=rec.n;b.appendChild(n);
    const m=document.createElement('div');m.className='dc-meta';const s=document.createElement('span');s.className='dc-stars';s.textContent=starText(rec.st||3);const p=document.createElement('span');p.textContent=(rec.p||0).toLocaleString(lang);m.appendChild(s);m.appendChild(p);b.appendChild(m);
    b.setAttribute('aria-label',rec.n);b.addEventListener('click',()=>openDetail(rec));grid.appendChild(b)}}

/* ---------------- sharing ---------------- */
function b64e(str){const by=new TextEncoder().encode(str);let bin='';by.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64d(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function encodePayload(recs){return b64e(JSON.stringify(recs.map(r=>[r.a,r.n,r.p,r.id,r.st])))}
function decodePayload(str){try{const arr=JSON.parse(b64d(str));if(!Array.isArray(arr))return null;return arr.slice(0,300).map(x=>({a:String(x[0]),n:String(x[1]||'').slice(0,16)||T('defaultName',{n:1}),p:clamp(parseInt(x[2],10)||0,0,999999),id:String(x[3]||rid()).slice(0,12),st:clamp(parseInt(x[4],10)||3,1,5),t:Date.now()})).filter(r=>decodeAttrs(r.a))}catch(e){return null}}
function shareBase(){return SHARE_BASE||String(location.href).split('#')[0]}
function fileName(name){return(String(name||T('title')).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')||'bambola')+'.png'}
function dataURLtoFile(u,name){const b=atob(u.split(',')[1]||''),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return new File([a],fileName(name),{type:'image/png'})}
const CAN_SHARE_PHOTO=(()=>{try{return!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[new File([new Uint8Array(1)],'t.png',{type:'image/png'})]}))}catch(e){return false}})();
function sharePhoto(url,name){try{navigator.share({files:[dataURLtoFile(url,name)],title:T('title'),text:T('shareMsg')}).catch(err=>{if(!err||err.name!=='AbortError')toast(T('photoHint'))})}catch(e){toast(T('photoHint'))}}
function downloadPhoto(url,name){try{const a=document.createElement('a');a.href=url;a.download=fileName(name);document.body.appendChild(a);a.click();a.remove()}catch(e){toast(T('photoHint'))}}
function photoButtons(getUrl,getName){const out=[];
  if(CAN_SHARE_PHOTO)out.push(el('button',{class:'btn small sun',type:'button',text:T('sharePhoto'),on:{click:()=>sharePhoto(getUrl(),getName())}}));
  if(STANDALONE)out.push(el('button',{class:'btn small',type:'button',text:T('downloadPhoto'),on:{click:()=>downloadPhoto(getUrl(),getName())}}));
  return out.length?el('div',{class:'photo-actions'},out):null}

/* ---------------- modal ---------------- */
let modalReturn=null;
function el(tag,attrs,kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){if(k==='text')e.textContent=attrs[k];else if(k==='on')for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else e.setAttribute(k,attrs[k])}(kids||[]).forEach(x=>x&&e.appendChild(x));return e}
function openModal(nodes){modalReturn=document.activeElement;const card=$('#modalCard');card.textContent='';nodes.forEach(n=>card.appendChild(n));show('#modal',true);const f=card.querySelector('button,input,textarea');if(f)f.focus()}
function closeModal(){if($('#modal').hidden)return;show('#modal',false);$('#modalCard').textContent='';if(modalReturn&&modalReturn.focus)try{modalReturn.focus()}catch(e){}}
function copyRow(value,id){const inp=el('input',{class:'field',readonly:'',id,value});inp.value=value;const btn=el('button',{class:'btn small sun',type:'button',text:T('copy')});
  btn.addEventListener('click',()=>{const done=()=>{btn.textContent=T('copied');setTimeout(()=>btn.textContent=T('copy'),1600)};try{navigator.clipboard.writeText(value).then(done,()=>{inp.focus();inp.select()})}catch(e){inp.focus();inp.select()}});
  inp.addEventListener('focus',()=>inp.select());return el('div',{class:'copyrow'},[inp,btn])}
function openShare(recs){if(!LINKS)return;const code='m1.'+encodePayload(recs),link=shareBase()+'#'+code;
  if(navigator.share){try{navigator.share({title:T('title'),text:T('shareMsg'),url:link}).catch(err=>{if(!err||err.name!=='AbortError')shareModal(code,link)});return}catch(e){}}
  shareModal(code,link)}
function shareModal(code,link){
  openModal([el('h3',{text:T('shareTitle')}),el('div',{class:'stack',style:'margin-top:12px'},[el('p',{class:'muted',text:T('shareText')}),el('span',{class:'lbl',text:T('linkLabel')}),copyRow(link,'shLink'),el('span',{class:'lbl',text:T('codeLabel')}),copyRow(code,'shCode'),el('div',{class:'row'},[el('button',{class:'btn',type:'button',text:T('close'),on:{click:closeModal}})])])])}
function openImport(){const ta=el('textarea',{class:'field',id:'impTxt',placeholder:T('importPh'),'aria-label':T('importPh')});const err=el('p',{class:'err',text:T('importBad')});err.hidden=true;
  const go=()=>{const m=String(ta.value||'').match(/m1\.([A-Za-z0-9_-]+)/);const recs=m&&decodePayload(m[1]);if(recs&&recs.length){openGift(recs)}else{err.hidden=false}};
  openModal([el('h3',{text:T('importTitle')}),el('div',{class:'stack',style:'margin-top:12px'},[ta,err,el('div',{class:'row'},[el('button',{class:'btn primary',type:'button',text:T('importGo'),on:{click:go}}),el('button',{class:'btn',type:'button',text:T('close'),on:{click:closeModal}})])])])}
function openGift(recs){const have=new Set(getCloset().map(r=>r.id)),fresh=recs.filter(r=>!have.has(r.id));
  const strip=el('div',{class:'gift-strip'});recs.slice(0,12).forEach(r=>{const f=el('figure');f.appendChild(dollCanvas(decodeAttrs(r.a),90,108));f.appendChild(el('span',{text:r.n}));strip.appendChild(f)});
  const kids=[el('h3',{text:T('giftTitle')}),el('div',{class:'stack',style:'margin-top:12px'},[el('p',{class:'muted',text:recs.length===1?T('giftOne'):T('giftN',{n:recs.length})}),strip])];
  const row=el('div',{class:'row',style:'margin-top:14px'});
  if(fresh.length){row.appendChild(el('button',{class:'btn primary',type:'button',text:T('addAll'),on:{click:()=>{const l=getCloset();fresh.forEach(r=>l.push(r));if(!setCloset(l)){toast(T('saveFail'));return}closeModal();toast(T('addedN',{n:fresh.length}));updateCount();if(!$('#closet').hidden)renderCloset();else openCloset()}}}))}
  else kids.push(el('p',{class:'muted',style:'margin-top:10px',text:T('already')}));
  row.appendChild(el('button',{class:'btn',type:'button',text:T('close'),on:{click:closeModal}}));kids.push(row);openModal(kids)}
function openDetail(rec){const d=decodeAttrs(rec.a);const img=el('img',{class:'polaroid',alt:rec.n});img.src=makePhoto(d,rec.n,rec.st||3);
  const conf=el('div',{class:'confirm'});conf.hidden=true;
  conf.appendChild(el('p',{style:'font-weight:800',text:T('delQ',{name:rec.n})}));
  conf.appendChild(el('div',{class:'row'},[el('button',{class:'btn primary small',type:'button',text:T('yes'),on:{click:()=>{setCloset(getCloset().filter(r=>r.id!==rec.id));closeModal();renderCloset();updateCount()}}}),el('button',{class:'btn small',type:'button',text:T('no'),on:{click:()=>{conf.hidden=true}}})]));
  openModal([el('div',{class:'detail'},[img,el('p',{class:'muted',text:T('photoHint')}),photoButtons(()=>img.src,()=>rec.n),el('h3',{text:rec.n}),el('p',{class:'dc-meta',style:'gap:14px'},[el('span',{class:'dc-stars',text:starText(rec.st||3)}),el('span',{text:(rec.p||0).toLocaleString(lang)+' '+T('pts')})]),
    el('div',{class:'row'},[el('button',{class:'btn sun lnk',type:'button',text:T('shareDoll'),on:{click:()=>openShare([rec])}}),el('button',{class:'btn',type:'button',text:T('del'),on:{click:()=>{conf.hidden=false}}}),el('button',{class:'btn',type:'button',text:T('close'),on:{click:closeModal}})]),conf])])}
let toastT=0;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}

/* ---------------- language ---------------- */
function applyLang(){document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=T(e.dataset.ph));
  document.querySelectorAll('[data-al]').forEach(e=>e.setAttribute('aria-label',T(e.dataset.al)));
  cv.setAttribute('aria-label',T('title'));
  document.querySelectorAll('#langBox button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.l===lang)));
  if(!$('#closet').hidden)renderCloset();
  if(lastSaved){$('#saveBtn').textContent=T('saved')}
  requestAnimationFrame(layout)}
LANGS.forEach(l=>{const b=el('button',{type:'button','data-l':l,text:l.toUpperCase()});b.addEventListener('click',()=>{lang=l;LS.set('pm-lang',l);applyLang()});$('#langBox').appendChild(b)});

/* ---------------- input ---------------- */
/* Touch: drag anywhere moves the doll relative to the finger (the finger never covers her); a quick tap jumps to that side. Mouse: follows the pointer. */
let drag=null;
function px(e){return e.clientX-cv.getBoundingClientRect().left}
const playing=()=>G.run&&(G.mode==='run'||G.mode==='count');
cv.addEventListener('pointerdown',e=>{if(!playing())return;e.preventDefault();drag={id:e.pointerId,x0:px(e),tx0:G.run.tx,t0:performance.now(),moved:0,mouse:e.pointerType==='mouse'};try{cv.setPointerCapture(e.pointerId)}catch(_){}if(drag.mouse)G.run.tx=px(e)});
cv.addEventListener('pointermove',e=>{if(!playing())return;if(drag&&e.pointerId===drag.id&&!drag.mouse){const dx=px(e)-drag.x0;drag.moved=Math.max(drag.moved,Math.abs(dx));G.run.tx=drag.tx0+dx*1.4}else if(e.pointerType==='mouse')G.run.tx=px(e)});
const endDrag=e=>{if(drag&&playing()&&e.type==='pointerup'&&!drag.mouse&&drag.moved<10&&performance.now()-drag.t0<280){const x=px(e);G.run.tx=x<trackX+halfW?trackX+halfW*.5:trackX+halfW*1.5}drag=null};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('touchmove',e=>{if(playing())e.preventDefault()},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{const typing=e.target&&/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(!typing&&playing()&&(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')){G.keys.left=true;e.preventDefault()}
  else if(!typing&&playing()&&(e.key==='ArrowRight'||e.key==='d'||e.key==='D')){G.keys.right=true;e.preventDefault()}
  else if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(!$('#closet').hidden)show('#closet',false)}});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')G.keys.left=false;if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')G.keys.right=false});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
$('#playBtn').addEventListener('click',play);
$('#closetBtn').addEventListener('click',openCloset);
$('#closetBack').addEventListener('click',()=>{show('#closet',false);if(G.mode==='home'){layout();$('#closetBtn').focus()}});
$('#closetPlay').addEventListener('click',play);
$('#shareClosetBtn').addEventListener('click',()=>{const l=getCloset();if(l.length)openShare(l)});
$('#importBtn').addEventListener('click',openImport);
$('#exitBtn').addEventListener('click',goHome);
$('#againBtn').addEventListener('click',play);
$('#homeBtn').addEventListener('click',goHome);
$('#saveBtn').addEventListener('click',saveDoll);
$('#dollName').addEventListener('keydown',e=>{if(e.key==='Enter')saveDoll()});
$('#shareNewBtn').addEventListener('click',()=>{if(lastSaved)openShare([lastSaved])});
$('#soundBtn').addEventListener('click',()=>{soundOn=!soundOn;LS.set('pm-sound',soundOn);soundIcon();if(soundOn)sfx.button()});
window.addEventListener('resize',layout);
window.addEventListener('orientationchange',()=>setTimeout(layout,300));
if(window.visualViewport)visualViewport.addEventListener('resize',layout);
$('#photoShareBtn').addEventListener('click',()=>sharePhoto($('#photoImg').src,lastSaved?lastSaved.n:$('#dollName').value));
$('#photoDlBtn').addEventListener('click',()=>downloadPhoto($('#photoImg').src,lastSaved?lastSaved.n:$('#dollName').value));

/* ---------------- loop ---------------- */
function drawHome(dt){G.home.s+=70*dt;G.home.next-=dt;
  if(G.home.next<=0){G.home.doll=randomDoll();G.home.next=2.6;burst(W/2,HL.y-HL.s*110,24,['#FFD23F','#FFFFFF','#FF5C8A','#19B5A5']);}
  drawTrack(G.home.s,HL.y);drawDoll(ctx,G.home.doll,{x:W/2,y:HL.y,s:HL.s,t:G.time,moving:1});drawParts()}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;G.time+=dt;updateParts(dt);ctx.clearRect(0,0,W,H);
  if(G.mode==='home')drawHome(dt);
  else if(G.mode==='count'||G.mode==='run'){updateRun(dt);if(G.mode==='count'||G.mode==='run')drawRun();else drawStage()}
  else{updateWalk(dt);drawStage()}
  requestAnimationFrame(frame)}

/* ---------------- boot ---------------- */
function boot(){if(!LS.get('pm-lang',null))lang=detectLang();if(!LINKS)app.classList.add('nolinks');soundIcon();applyLang();updateCount();layout();requestAnimationFrame(frame);if(GP.loadingDone)GP.loadingDone()}
Promise.resolve().then(()=>GP.init&&GP.init()).catch(e=>console.warn('Platform init failed, playing without it',e)).then(boot);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>layout());
function checkHash(){const m=String(location.hash||'').match(/m1\.([A-Za-z0-9_-]+)/);if(!m)return;const recs=decodePayload(m[1]);if(recs&&recs.length)openGift(recs)}
if(LINKS){checkHash();window.addEventListener('hashchange',checkHash)}
})();
</script>
